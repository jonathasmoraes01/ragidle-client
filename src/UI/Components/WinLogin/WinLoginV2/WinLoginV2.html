<div id="WinLogin" class="win_login">
	<div class="wl-window ri-window">
		<div class="wl-header ri-header">
			<span class="wl-title ri-title">Ragnarok Classic Idle</span>
			<button type="button" class="exit wl-close ri-close" title="Sair">&times;</button>
		</div>

		<div class="wl-body">
			<label class="wl-field">
				<span class="wl-label">Usuário</span>
				<!-- data-permitir-autofill: AQUI o preenchimento salvo e desejado;
				     o escudo do GUIComponent nao toca nestes dois campos. -->
				<input id="user" class="user ri-input" type="text" value="" autocomplete="username" data-permitir-autofill />
			</label>
			<label class="wl-field">
				<span class="wl-label">Senha</span>
				<input id="pass" class="pass ri-input" type="password" value="" autocomplete="current-password" data-permitir-autofill />
			</label>

			<button id="save" class="save wl-save" type="button">
				<span class="wl-save-box"></span>
				<span class="wl-save-label">Manter conectado</span>
			</button>

			<button id="btn_connect" class="btn connect ri-btn" type="submit">Entrar</button>

			<div class="wl-links">
				<button class="btn replay ri-btn ri-btn--sec" type="button">Replay</button>
				<button class="btn signup ri-btn ri-btn--sec" type="button">Cadastrar</button>
			</div>
			<input type="file" class="replay-upload" accept=".rrf" style="display: none" />
		</div>
	</div>
</div>
