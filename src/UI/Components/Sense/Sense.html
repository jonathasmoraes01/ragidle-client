<!-- Fase 4 (01/09/2026): janela "Sentir Inimigo" (skill Sense) no design
     system. Ganchos que Sense.js consulta, todos preservados: .header (alca
     de arrasto) / .header .title / .close / #canvas_model / os pares
     #label_* + #value_* (name, size, level, type, hp, mdef, def, attr) /
     #element_water #element_wind #element_shadow #element_earth
     #element_poison #element_ghost #element_fire #element_holy
     #element_undead. Estas 9 celulas recebem className INTEIRO via JS
     (_setElementClass sobrescreve com '', 'element_good' ou 'element_bad'),
     entao a pele delas mora em seletor de ID/tabela no CSS — uma classe
     extra aqui seria apagada no primeiro pacote. Moldura de bitmap
     (titlebar_*.bmp, btnbar_*.bmp) saiu; o botao que antes usava btn_ok.bmp
     (rotulo pintado, funcionava como "fechar") virou texto "Fechar". -->
<div id="win_sense" class="ri-window">
	<div class="header ri-header">
		<span class="title ri-title"></span>
	</div>

	<div class="content">
		<div class="sprite">
			<canvas id="canvas_model" width="120" height="155" style="pointer-events: none"></canvas>
		</div>

		<table class="stats">
			<tr>
				<td id="label_name"></td>
				<td id="value_name"></td>
				<td id="label_size"></td>
				<td id="value_size"></td>
			</tr>
			<tr>
				<td id="label_level"></td>
				<td id="value_level"></td>
				<td id="label_type"></td>
				<td id="value_type"></td>
			</tr>
			<tr>
				<td id="label_hp"></td>
				<td id="value_hp"></td>
				<td id="label_mdef"></td>
				<td id="value_mdef"></td>
			</tr>
			<tr>
				<td id="label_def"></td>
				<td id="value_def"></td>
				<td id="label_attr"></td>
				<td id="value_attr"></td>
			</tr>
		</table>

		<table class="elements">
			<tr>
				<td id="element_water"></td>
				<td id="element_wind"></td>
				<td id="element_shadow"></td>
			</tr>
			<tr>
				<td id="element_earth"></td>
				<td id="element_poison"></td>
				<td id="element_ghost"></td>
			</tr>
			<tr>
				<td id="element_fire"></td>
				<td id="element_holy"></td>
				<td id="element_undead"></td>
			</tr>
		</table>
	</div>

	<div class="footer">
		<div class="btns">
			<button type="button" class="btn close ri-btn">Fechar</button>
		</div>
	</div>
</div>
