		<!-- Characters infos -->
		<div class="charinfo ri-card">
			<div class="map"></div>
			<div class="job"></div>
			<div class="lvl"></div>
			<div class="exp"></div>
			<div class="hp"></div>
			<div class="sp"></div>
			<!-- "span", nao "div", de proposito: moveCursorToGrid() (V4) tem um
			     ramo que faz "charinfo.querySelectorAll('div').forEach(div =>
			     div.textContent = '')" quando o slot esta vazio -- um DIV
			     agrupador aqui seria pego por esse seletor generico e teria
			     seus filhos apagados (textContent limpa a subarvore inteira).
			     Um span com display:grid no CSS agrupa do mesmo jeito sem
			     entrar nesse seletor. -->
			<span class="cs-attrs">
				<div class="str"></div>
				<div class="agi"></div>
				<div class="vit"></div>
				<div class="int"></div>
				<div class="dex"></div>
				<div class="luk"></div>
			</span>
			<!-- Rotulos em PORTUGUES (20/08/2026). Eram <ui-text msg="NNNN">, que
			     le a msgstring do cliente e devolve INGLES ("Delete", "Cancel
			     Deletion", "Start Game") -- o resto desta janela ja estava em
			     portugues ("Selecionar Personagem", Mapa/Classe/Nivel/EXP), e
			     metade da tela em cada idioma era pior do que qualquer um dos
			     dois. O <ui-text> nao serve de fallback aqui: ele SOBRESCREVE o
			     conteudo sempre que DB.getMessage devolve algo, entao o jeito de
			     fixar o texto e nao usar o elemento. Ficam os mesmos seletores
			     (.delete/.canceldelete/.finaldelete/.ok) que o
			     CharSelectCommon.js e a automacao usam. -->
			<ui-button class="btn delete ri-btn ri-btn--sec">Excluir</ui-button>
			<ui-button class="btn canceldelete ri-btn ri-btn--sec">Cancelar</ui-button>
			<ui-button class="btn finaldelete ri-btn ri-btn--ouro">Excluir</ui-button>
			<ui-button class="btn ok ri-btn">Entrar</ui-button>
			<!-- Pages infos: markup mantido pelo contrato de versoes irmas
			     (V1/V2/V3 pagined usam), mas o layout em grade (V4) nunca
			     escreve nele -- CharSelectCommon.js so atualiza ".pageinfo"
			     no ramo "!gridLayout". Escondido pra nao mostrar "1 / 9"
			     estatico e errado (15 slots reais, nao 9). -->
			<div class="pageinfo"><span class="current">1</span> / <span class="count">9</span></div>
		</div>
