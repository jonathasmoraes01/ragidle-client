<div id="BasicInfoIdle">
	<div class="bi-window ri-window">
		<div class="bi-header ri-header">
			<span class="bi-header-title ri-title">Personagem</span>
			<!-- Botao de minimizar (19/08/2026, pedido do dono): substitui a
			     barra "Recolher" que ficava embaixo da janela -- agora mora na
			     barra de titulo, no estilo Windows (traco horizontal, circulo
			     discreto, mesmo tratamento visual de ".ri-close"). Fica DENTRO
			     de ".bi-header", que nunca some -- nos dois estados (expandido
			     e compacto) o cabecalho continua de pe, entao o botao continua
			     sempre visivel e clicavel (era essa a garantia que a barra de
			     baixo dava antes; a barra de titulo da a mesma garantia agora).
			     O texto do botao e o titulo/aria-label mudam via JS conforme o
			     estado (ver applyCompactState() em BasicInfoIdle.js); o glifo
			     (traco) fica o mesmo nos dois estados, igual ao botao real de
			     minimizar do Windows. -->
			<button type="button" class="bi-minimize ri-close" data-action="minimize" title="Recolher painel" aria-label="Recolher painel para modo compacto" aria-expanded="true">&minus;</button>
		</div>

		<div class="bi-body">
			<div class="bi-top">
				<div class="bi-avatar-frame">
					<div class="bi-avatar">
						<img class="bi-avatar-img" alt="" />
						<span class="bi-avatar-initial">?</span>
					</div>
				</div>
				<div class="bi-identity">
					<div class="bi-name">—</div>
					<div class="bi-class">—</div>
				</div>
			</div>

			<div class="bi-levels">
				<!-- A PORCENTAGEM DENTRO DA BARRA (11/09/2026, pedido do dono:
				     "pequeno, visivel, dentro da barra com a cor verde"). O
				     numero e DERIVADO no cliente a partir de
				     `BasicInfo.getUI().base_exp / base_exp_next` — nao ha campo
				     novo no pacote nem nada a pedir ao servidor. O texto e
				     escrito por `setText`, que compara antes de escrever: este
				     painel repesquisa o estado a cada 250 ms, e `textContent`
				     direto somaria duas invalidacoes de layout por volta. -->
				<div class="bi-level-row">
					<span class="bi-level-label">Base Lv. <b class="bi-blvl-value">1</b></span>
					<div class="bi-exp-track"><div class="bi-exp-fill bi-bexp-fill"></div><span class="bi-exp-pct bi-bexp-pct">0,0%</span></div>
				</div>
				<div class="bi-level-row">
					<span class="bi-level-label">Classe Lv. <b class="bi-jlvl-value">1</b></span>
					<div class="bi-exp-track"><div class="bi-exp-fill bi-jexp-fill"></div><span class="bi-exp-pct bi-jexp-pct">0,0%</span></div>
				</div>
			</div>

			<div class="bi-bar bi-bar-hp">
				<!-- stroke=currentColor: a cor desce do token em .bi-bar-hp/.bi-bar-sp
				     no CSS (Fase 3: eram os 2 ultimos hex cravados em HTML da HUD). -->
				<svg class="bi-bar-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 20 C4 14 4 9 8 6.5 A4 4 0 0 1 12 8 A4 4 0 0 1 16 6.5 C20 9 20 14 12 20 Z"></path>
				</svg>
				<div class="bi-bar-track">
					<div class="bi-bar-fill"></div>
					<span class="bi-bar-text">0 / 0</span>
				</div>
				<span class="bi-bar-pct">0,0%</span>
			</div>

			<div class="bi-bar bi-bar-sp">
				<svg class="bi-bar-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 3 C15 8 18 11.5 18 15 A6 6 0 0 1 6 15 C6 11.5 9 8 12 3 Z"></path>
				</svg>
				<div class="bi-bar-track">
					<div class="bi-bar-fill"></div>
					<span class="bi-bar-text">0 / 0</span>
				</div>
				<span class="bi-bar-pct">0,0%</span>
			</div>

			<div class="bi-divisor"><span class="bi-divisor-gem"></span></div>

			<div class="bi-stats-line">
				<span class="bi-stats-text">Peso <span class="bi-weight">0 / 0</span></span>
			</div>
			<!-- A grade de icones (Status/Equipamento/Inventario/Skills/Caca/
			     Config/Menu/Admin) foi removida em 19/08/2026 (pedido do dono):
			     o painel do personagem passa a ser SO informacao, nenhum icone
			     clicavel. Os mesmos destinos foram reproduzidos na constelacao
			     de UI/Components/TopMenuIdle/TopMenuIdle.html -- unico lugar
			     com icones clicaveis agora. -->
		</div>

		<!-- Carteira (20/08/2026, pedido do dono com print): o contador de
		     moedas MUDOU DE CASA -- era uma capsula solta no topo ao centro
		     (UI/Components/TopBarIdle, apagado nesta mesma rodada) e agora
		     mora aqui, no canto superior esquerdo junto do painel de vida.
		     Fica IRMAO de ".bi-body", nao filho dele, e essa e a razao de
		     ser: a regra do modo compacto so esconde filhos de
		     ".bi-body.is-compact" (ver BasicInfoIdle.css), entao o contador
		     continua de pe nos DOIS estados -- e antes ele nunca podia ser
		     escondido, porque flutuava sozinho na tela. Estar dentro do
		     mesmo host tambem resolve o arraste de graca: a barra de titulo
		     move a janela inteira, e a carteira vai junto por construcao. O
		     medalhao continua sendo o glifo "zeny" de UI/ri-icones.js (o que
		     INFORMA e arte/icone; o que DELIMITA e CSS). ".bi-zeny" e o
		     MESMO seletor de antes -- o JS nao mudou de contrato, so o lugar
		     onde o numero aparece. -->
		<div class="bi-moeda">
			<span class="bi-moeda-medalha ri-disc"><!--RI_ICONE:zeny--></span>
			<span class="bi-moeda-rotulo">Zeny</span>
			<span class="bi-zeny">0</span>
		</div>
		<!-- A segunda moeda (28/08/2026). O dono perguntou onde o jogador ve o
		     saldo de cash e a resposta era "em lugar nenhum, fora da propria
		     loja" -- inclusive depois de a carta de boas-vindas do beta
		     prometer 10.000. Ela mora na MESMA faixa do zeny, e nao numa
		     janela nova, porque a pergunta e "quanto eu tenho" e essa e a
		     faixa que responde isso. O medalhao e um glifo proprio: duas
		     moedas com o mesmo icone lado a lado seriam pior que uma. -->
		<div class="bi-moeda bi-moeda-cash">
			<span class="bi-moeda-medalha ri-disc"><!--RI_ICONE:cash--></span>
			<span class="bi-moeda-rotulo">Cash</span>
			<span class="bi-cash">0</span>
		</div>

		<!-- WIFI E BATERIA (08/09/2026) — de volta, mas NA FAIXA DO TOPO.
		     .
		     Eles moravam no rodape do pe da tela, que saiu por ordem do dono
		     (o EXP dali ja estava aqui em cima, duplicado). Os dois nao eram o
		     motivo da remocao e voltaram — mas voltar como FAIXA custaria de
		     novo os 22px que a remocao devolveu ao jogo, e por um motivo menor
		     que o original.
		     .
		     Aqui eles nao custam altura nenhuma: a faixa de Zeny/Cash ja
		     existe, ja e desenhada, e tem folga a direita. E a razao de os dois
		     existirem continua valendo — no PWA instalado a barra de status do
		     aparelho some (display fullscreen), entao sem isto o jogador nao ve
		     sinal nem carga em lugar nenhum.
		     .
		     Os seletores sao os MESMOS de antes (`.bi-rodape-wifi`,
		     `.bi-rodape-bateria*`): `ligarBateriaEWifi()` no JS nao mudou de
		     contrato, so o lugar onde os dois aparecem. Trocar o nome custaria
		     uma edicao no JS e nao compraria nada.
		     .
		     `aria-hidden`: sao indicadores do APARELHO, e nao do jogo. Um
		     leitor de tela ja anuncia sinal e bateria pelo sistema; repetir
		     aqui seria ruido. -->
		<div class="bi-aparelho" aria-hidden="true">
			<svg class="bi-rodape-wifi" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
				<path d="M2 9 C8 3.5 16 3.5 22 9"></path>
				<path d="M5.5 12.5 C9.5 9 14.5 9 18.5 12.5"></path>
				<path d="M9 16 C11 14.5 13 14.5 15 16"></path>
				<circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"></circle>
			</svg>
			<span class="bi-rodape-bateria">
				<span class="bi-rodape-bateria-caixa"><span class="bi-rodape-bateria-nivel"></span></span>
				<span class="bi-rodape-bateria-texto">—</span>
			</span>
		</div>


	</div>

	<!-- O RODAPE DA HUD VERTICAL FOI REMOVIDO (08/09/2026, ordem do dono).
	     .
	     Ele era a faixa fina do pe da tela: "Lv. N", a barra de EXP com os
	     numeros, wifi e bateria — o rodape do mockup de D-939.
	     .
	     Palavras do dono, com um print da faixa: *"vamos remover essa parte de
	     baixo pois ja tem la em cima ja tem o xp"*. E ele esta certo na
	     aritmetica: a BARRA DO TOPO deste mesmo componente ja mostra Base Lv.,
	     Classe Lv. e as duas barras de experiencia. O rodape dizia a mesma
	     coisa uma segunda vez, e cobrava 22px de uma tela onde a prioridade
	     declarada e a CENA de caca.
	     .
	     O wifi e a bateria foram junto, e vale registrar por que eles
	     existiam: no PWA instalado a barra de status do aparelho some
	     (display fullscreen), e o mockup os devolvia. Esse argumento continua
	     de pe e e o melhor argumento contra esta remocao — quem for desfazer
	     comeca por ele. O que pesou mais foi que a faixa inteira saiu por um
	     pedido sobre o EXP, e manter meia faixa so pelos dois icones custaria
	     os mesmos 22px pelo menor dos dois motivos.
	     .
	     `sincronizarRodapeVertical()` e `ligarBateriaEWifi()` (BasicInfoIdle.js)
	     FICAM: as duas ja saem cedo quando o elemento nao existe, e sao a
	     implementacao pronta caso o dono queira a faixa de volta. -->
</div>
