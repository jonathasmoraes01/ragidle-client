<div id="BasicInfoIdle">
	<div class="bi-window ri-window">
		<div class="bi-header ri-header">
			<span class="bi-header-title ri-title">Personagem</span>
			<!-- Botao de minimizar (19/08/2026, pedido do dono): substitui a
			     barra "Recolher" que ficava embaixo da janela -- agora mora na
			     barra de titulo, no estilo Windows (traco horizontal, circulo
			     discreto, mesmo tratamento visual de ".ri-close"). Fica DENTRO
			     de ".bi-header", que nunca some -- nos dois estados (expandido
			     e compacto) o cabecalho continua de pe, entao o botao continua
			     sempre visivel e clicavel (era essa a garantia que a barra de
			     baixo dava antes; a barra de titulo da a mesma garantia agora).
			     O texto do botao e o titulo/aria-label mudam via JS conforme o
			     estado (ver applyCompactState() em BasicInfoIdle.js); o glifo
			     (traco) fica o mesmo nos dois estados, igual ao botao real de
			     minimizar do Windows. -->
			<button type="button" class="bi-minimize ri-close" data-action="minimize" title="Recolher painel" aria-label="Recolher painel para modo compacto" aria-expanded="true">&minus;</button>
		</div>

		<div class="bi-body">
			<div class="bi-top">
				<div class="bi-avatar-frame">
					<div class="bi-avatar">
						<img class="bi-avatar-img" alt="" />
						<span class="bi-avatar-initial">?</span>
					</div>
				</div>
				<div class="bi-identity">
					<div class="bi-name">—</div>
					<div class="bi-class">—</div>
				</div>
			</div>

			<div class="bi-levels">
				<div class="bi-level-row">
					<span class="bi-level-label">Base Lv. <b class="bi-blvl-value">1</b></span>
					<div class="bi-exp-track"><div class="bi-exp-fill bi-bexp-fill"></div></div>
				</div>
				<div class="bi-level-row">
					<span class="bi-level-label">Classe Lv. <b class="bi-jlvl-value">1</b></span>
					<div class="bi-exp-track"><div class="bi-exp-fill bi-jexp-fill"></div></div>
				</div>
			</div>

			<div class="bi-bar bi-bar-hp">
				<svg class="bi-bar-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#e5484d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 20 C4 14 4 9 8 6.5 A4 4 0 0 1 12 8 A4 4 0 0 1 16 6.5 C20 9 20 14 12 20 Z"></path>
				</svg>
				<div class="bi-bar-track">
					<div class="bi-bar-fill"></div>
					<span class="bi-bar-text">0 / 0</span>
				</div>
				<span class="bi-bar-pct">0,0%</span>
			</div>

			<div class="bi-bar bi-bar-sp">
				<svg class="bi-bar-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#3e8bef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 3 C15 8 18 11.5 18 15 A6 6 0 0 1 6 15 C6 11.5 9 8 12 3 Z"></path>
				</svg>
				<div class="bi-bar-track">
					<div class="bi-bar-fill"></div>
					<span class="bi-bar-text">0 / 0</span>
				</div>
				<span class="bi-bar-pct">0,0%</span>
			</div>

			<div class="bi-divisor"><span class="bi-divisor-gem"></span></div>

			<div class="bi-stats-line">
				<span class="bi-stats-text">Peso <span class="bi-weight">0 / 0</span></span>
			</div>
			<!-- A grade de icones (Status/Equipamento/Inventario/Skills/Caca/
			     Config/Menu/Admin) foi removida em 19/08/2026 (pedido do dono):
			     o painel do personagem passa a ser SO informacao, nenhum icone
			     clicavel. Os mesmos destinos foram reproduzidos na constelacao
			     de UI/Components/TopMenuIdle/TopMenuIdle.html -- unico lugar
			     com icones clicaveis agora. -->
		</div>

		<!-- Carteira (20/08/2026, pedido do dono com print): o contador de
		     moedas MUDOU DE CASA -- era uma capsula solta no topo ao centro
		     (UI/Components/TopBarIdle, apagado nesta mesma rodada) e agora
		     mora aqui, no canto superior esquerdo junto do painel de vida.
		     Fica IRMAO de ".bi-body", nao filho dele, e essa e a razao de
		     ser: a regra do modo compacto so esconde filhos de
		     ".bi-body.is-compact" (ver BasicInfoIdle.css), entao o contador
		     continua de pe nos DOIS estados -- e antes ele nunca podia ser
		     escondido, porque flutuava sozinho na tela. Estar dentro do
		     mesmo host tambem resolve o arraste de graca: a barra de titulo
		     move a janela inteira, e a carteira vai junto por construcao. O
		     medalhao continua sendo o glifo "zeny" de UI/ri-icones.js (o que
		     INFORMA e arte/icone; o que DELIMITA e CSS). ".bi-zeny" e o
		     MESMO seletor de antes -- o JS nao mudou de contrato, so o lugar
		     onde o numero aparece. -->
		<div class="bi-moeda">
			<span class="bi-moeda-medalha ri-disc"><!--RI_ICONE:zeny--></span>
			<span class="bi-moeda-rotulo">Zeny</span>
			<span class="bi-zeny">0</span>
		</div>
		<!-- A segunda moeda (28/08/2026). O dono perguntou onde o jogador ve o
		     saldo de cash e a resposta era "em lugar nenhum, fora da propria
		     loja" -- inclusive depois de a carta de boas-vindas do beta
		     prometer 10.000. Ela mora na MESMA faixa do zeny, e nao numa
		     janela nova, porque a pergunta e "quanto eu tenho" e essa e a
		     faixa que responde isso. O medalhao e um glifo proprio: duas
		     moedas com o mesmo icone lado a lado seriam pior que uma. -->
		<div class="bi-moeda bi-moeda-cash">
			<span class="bi-moeda-medalha ri-disc"><!--RI_ICONE:cash--></span>
			<span class="bi-moeda-rotulo">Cash</span>
			<span class="bi-cash">0</span>
		</div>
	</div>
</div>
