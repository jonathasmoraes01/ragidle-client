<div class="ItemInfo">
	<div class="container">
		<div class="collection"></div>
		<div class="preview-action">
			<button
				class="btn_mounting"
				data-background="equip_preview\btn_mounting_normal.bmp"
				data-down="equip_preview\btn_mounting_press.bmp"
				data-hover="equip_preview\btn_mounting_over.bmp"
				type="button"
				data-text="2922"
			></button>
		</div>
		<div class="event_view">
			<button
				class="view"
				data-background="btn_view.bmp"
				data-down="btn_view_a.bmp"
				data-hover="btn_view_b.bmp"
			></button>
			<span class="overlay_open" data-text="1294">Read</span>
			<span class="overlay_read" data-text="1295">Auto Read</span>
		</div>
		<div class="title"></div>
		<button class="close" aria-label="Fechar"></button>
		<div class="description ri-scroll">
			<div class="description-inner"></div>
		</div>
		<button class="extend" aria-label="Redimensionar"></button>
	</div>
	<div class="option-container"></div>
	<div class="cardlist">
		<div class="border"></div>
	</div>
	<!--
		LINKAR NO CHAT (D-946, 06/09/2026 — pedido do dono).

		O cliente ja sabia linkar item (`DB.createItemLink` + o `.item-link`
		clicavel de `ChatBox.addText`), mas o unico gesto que produzia um link
		era SHIFT+clique na mochila — e no celular, onde este jogo mora, nao ha
		SHIFT. Este botao e a porta que faltava.

		Ele fica FORA do `.container` e depois da lista de cartas de proposito:
		nao e informacao da ficha, e uma ACAO sobre ela — mesma vizinhanca da
		capsula de runas. Dentro do container ele disputaria com o
		`resize()`, que manda na altura de tudo o que mora la (o contrato dos
		45px esta no topo do ItemInfo.css).
	-->
	<!--
		A COMPARAÇÃO COM O EQUIPADO (08/09/2026 — pedido do alfa).

		Preenchida por ItemInfo.setComparacao() com o que o SERVIDOR calculou
		(ZC_RAGIDLE_ITEM): quem sai do corpo, e as linhas de diferença da ficha
		com sinal e cor. A janela nunca recalcula — ver o cabeçalho do pacote em
		PacketStructure.js. Fora do `.container` pela mesma razão do botão de
		link: não é a ficha do item, é o veredito de uma TROCA.
	-->
	<!--
		O SELO "Equipado — <espaço>" (08/09/2026, pedido do alfa: *"indique
		claramente quando o item estiver equipado e em qual espaço"*).

		A dica de hover já dizia isso, e no dedo NÃO HÁ HOVER: no celular esta
		janela é o único lugar onde a peça vestida se apresenta. Quem preenche é
		ItemInfo.setVestido(), chamada por quem abriu a ficha — a janela não
		adivinha o que está no corpo.
	-->
	<div class="vestido" hidden></div>
	<div class="comparacao" hidden></div>
	<button type="button" class="link-chat" title="Põe o item na barra de digitação do chat">
		Linkar no chat
	</button>
</div>

<div id="moveinfo-tooltip"></div>
