<!-- Fase 3 (01/09/2026): o Banco saiu do bitmap (bank/bg_bank.bmp, os botoes
     bank/btn_*.bmp e a titlebar_mid.bmp) e entrou no design system. Ganchos
     que Bank.js consulta, TODOS preservados: .close (fechar) / .depo (campo
     de valor) / .plus / .minus / .max / .tenmil / .onemil / .hundtsn /
     .deposit / .withdraw / .errorupdate / .inbank.currency /
     .onhand.currency. Os data-text (2771..2778) continuam apontando pros
     MESMOS ids da tabela de mensagens -- so a pele mudou, o texto e o
     mesmo de sempre. O botao-icone decorativo da barra de titulo original
     (um ".base" sem "close", sem listener nenhum em Bank.js) saiu: nao
     tinha funcao, so bitmap -- janela e estreita demais (280px) pra
     carregar chrome morto. -->
<div id="Bank">
	<div class="ba-janela ri-window">
		<div class="titlebar ri-header">
			<span class="text ri-title" data-text="2771"></span>
			<button type="button" class="base close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="container">
			<div class="ba-saldo">
				<div class="ba-linha">
					<span class="ba-rotulo" data-text="2772"></span>
					<span class="inbank currency ba-valor">0z</span>
				</div>
				<div class="ba-linha">
					<span class="ba-rotulo" data-text="2773"></span>
					<span class="onhand currency ba-valor">0z</span>
				</div>
			</div>

			<div class="ba-campo">
				<input class="depo no-spinners ri-input" type="text" min="0" maxlength="10" aria-label="Valor" />
				<!-- +/- em GLIFO: as mensagens 2776/2777 sao frases inteiras e
				     estouravam os 280px da janela (visto na foto da Fase 3).
				     O sentido continua obvio ao lado do campo, e o rotulo
				     comprido vive no title. -->
				<button type="button" class="plus buttons ri-btn--sec ba-passo" title="Aumentar">+</button>
				<button type="button" class="minus buttons ri-btn--sec ba-passo" title="Diminuir">&minus;</button>
			</div>

			<div class="ba-acoes">
				<button type="button" class="deposit buttons ri-btn">
					<span class="name" data-text="2774"></span>
				</button>
				<button type="button" class="withdraw buttons ri-btn ri-btn--sec">
					<span class="name" data-text="2775"></span>
				</button>
			</div>

			<div class="errorupdate"></div>

			<div class="ba-rapidos">
				<button type="button" class="max buttons ri-btn--sec ba-rapido">
					<span class="name" data-text="2778"></span>
				</button>
				<button type="button" class="tenmil buttons ri-btn--sec ba-rapido">
					<span class="name">+ 10.000.000</span>
				</button>
				<button type="button" class="onemil buttons ri-btn--sec ba-rapido">
					<span class="name">+ 1.000.000</span>
				</button>
				<button type="button" class="hundtsn buttons ri-btn--sec ba-rapido">
					<span class="name">+ 100.000</span>
				</button>
			</div>
		</div>
	</div>
</div>
