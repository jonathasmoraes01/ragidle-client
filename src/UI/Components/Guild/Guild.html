<div id="Guild" class="ri-window">
	<div class="titlebar ri-header">
		<span class="ri-title">Guilda</span>
		<button type="button" class="close ri-close" title="Fechar">&times;</button>
	</div>

	<div class="tabs">
		<!--
		--><button data-flag="0" class="info">Geral</button><!--
		--><button data-flag="1" class="members">Membros</button><!--
		--><button data-flag="2" class="positions">Cargos</button><!--
		--><button data-flag="3" class="skills">Skills</button><!--
		--><button data-flag="4" class="history">Expulsos</button><!--
		--><button data-flag="6" class="notice">Aviso</button>
	</div>

	<div class="panel">
		<!-- INFO TAB -->
		<div class="content info ri-scroll">
			<div class="info-grid">
				<div class="info-col">
					<div class="ri-card info-card">
						<div class="name"><span class="label">Nome da Guilda</span><span class="value"></span></div>
						<div class="level"><span class="label">Nível</span><span class="value"></span></div>
						<div class="master"><span class="label">Mestre</span><span class="value"></span></div>
						<div class="members">
							<span class="label">Membros</span>
							<span class="value"><span class="numMember">0</span> / <span class="maxMember">0</span></span>
							<span class="online-badge"><span class="online-dot"></span>on-line: <span class="online"></span></span>
						</div>
						<div class="avglevel"><span class="label">Nível Médio</span><span class="value"></span></div>
						<div class="territory"><span class="label">Território</span><span class="value"></span></div>
						<div class="exp"><span class="label">EXP</span><span class="value"></span></div>
						<div class="tax"><span class="label">Taxa</span><span class="value">0</span></div>
					</div>

					<div class="ri-card tendency">
						<div class="title"><span class="label">Tendência</span><span class="value"></span></div>
						<div class="tendency-chart">
							<canvas width="90" height="90"></canvas>
							<div class="righteous">R</div>
							<div class="wiked">W</div>
							<div class="vulgar">V</div>
							<div class="famed">F</div>
						</div>
					</div>
				</div>

				<div class="info-col">
					<div class="ri-card emblem-card">
						<div class="emblem">Emblema</div>
						<div class="emblem_container"></div>
						<span class="emblem_edit ri-btn ri-btn--sec" role="button" tabindex="0">
							Editar
							<input type="file" />
						</span>
					</div>

					<div class="ri-card">
						<div class="ally">Aliança</div>
						<div class="ally_list"></div>
					</div>

					<div class="ri-card">
						<div class="hostile">Antagonista</div>
						<div class="hostile_list"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- MEMBERS TAB -->
		<div class="content members ri-scroll">
			<table>
				<thead>
					<tr>
						<th class="name">Nome</th>
						<th class="position">Cargo</th>
						<th class="job">Classe</th>
						<th class="level">Nível</th>
						<th class="note">Nota</th>
						<th class="devotion">Devoção</th>
						<th class="tax">Taxa</th>
					</tr>
				</thead>
				<tbody>
					<tr class="MemberView">
						<td class="name">
							<canvas width="30" height="30"></canvas>
							<span class="value"></span>
						</td>
						<td class="position"></td>
						<td class="job"></td>
						<td class="level"></td>
						<td class="note"></td>
						<td class="devotion"></td>
						<td class="tax"></td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- POSITIONS TAB -->
		<div class="content positions ri-scroll">
			<table>
				<thead>
					<tr>
						<th class="id">Rank</th>
						<th class="title">Título do Cargo</th>
						<th class="invite">Convite</th>
						<th class="punish">Punir</th>
						<th class="tax">Taxa</th>
					</tr>
				</thead>
				<tbody>
					<tr class="PositionView">
						<td class="id"></td>
						<td class="title">
							<input type="text" value="" />
						</td>
						<td class="invite">
							<ui-button bg="checkbox_0.bmp" class="off"></ui-button>
						</td>
						<td class="punish">
							<ui-button bg="checkbox_0.bmp" class="off"></ui-button>
						</td>
						<td class="tax"><input type="text" value="0" /> %</td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- SKILLS TAB -->
		<div class="content skills">
			<div class="skill_list ri-scroll">
				<table>
					<!-- Just to get reference, will be removed -->
					<button type="button" class="btn levelup ri-btn ri-btn--sec">Subir</button>
				</table>
			</div>

			<div class="footer">
				<div class="text">Pontos de Habilidade: <span class="skpoints_count">0</span></div>
				<button type="button" class="btn apply ri-btn">Aplicar</button>
				<button type="button" class="btn reset ri-btn ri-btn--sec">Redefinir</button>
			</div>
		</div>

		<!-- HISTORY BAN TAB -->
		<div class="content history ri-scroll">
			<table>
				<thead>
					<tr>
						<th class="name">Nome</th>
						<th class="reason">Motivo da Expulsão</th>
					</tr>
				</thead>
				<tbody>
					<tr class="ExpelView">
						<td class="name"></td>
						<td class="reason"></td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- NOTICE TAB -->
		<div class="content notice ri-scroll">
			<div class="subjectTitle">Título</div>
			<input type="text" class="subject ri-input" />

			<div class="noticeTitle">Conteúdo</div>
			<textarea class="notice ri-input"></textarea>
		</div>
	</div>

	<div class="footer">
		<button type="button" class="btn_disband ri-btn ri-btn--sec">Dissolver</button>
		<button type="button" class="btn_ok ri-btn">OK</button>
	</div>
</div>
