<div id="IdleSkills">
	<button type="button" class="is-button" title="Habilidades" aria-label="Habilidades"><!--RI_ICONE:skills--></button>

	<div class="is-window ri-window ri-anima">
		<div class="is-titlebar ri-header">
			<span class="is-title ri-title">Habilidades</span>
			<button type="button" class="is-close ri-close" title="Fechar">&times;</button>
		</div>

		<!--
			Barra de CONTEXTO (D-902): o retrato + classe + níveis do personagem à
			esquerda (preenchido pelo JS, renderTitle), o estado ("Carregando…") no
			meio e a chave "Descrições" à direita — que recolhe/mostra o dossiê. O
			<input> continua sendo `.is-desc-check`: é ele que a prova clica.
		-->
		<div class="is-toolbar">
			<span class="is-classe"></span>
			<span class="is-status"></span>
			<label class="is-desc-toggle" title="Mostrar o painel de descrição da habilidade">
				<input type="checkbox" class="is-desc-check" checked />
				<span>Descrições</span>
			</label>
		</div>

		<div class="is-content">
			<!-- Trilho de DEGRAUS da carreira. Preenchido pelo servidor
			     (payload.graus): um Aprendiz tem uma aba, um Cavaleiro tem três. -->
			<div class="is-grausrail"></div>

			<!-- A PRANCHETA. A marca d'água da classe é camada de FUNDO de
			     `.is-arvore` (var(--is-marca), escrita pelo JS); `.is-tela` é o plano
			     posicionado (nós em position:absolute + o SVG dos fios por baixo);
			     `.is-arvore` rola. -->
			<div class="is-arvore ri-scroll">
				<div class="is-tela">
					<div class="is-empty">Abra a janela de habilidades para carregar.</div>
				</div>
			</div>

			<!-- O DOSSIÊ: o corpo rola por dentro, o rodapé (próximo nível +
			     rotação) fica fixo à vista. -->
			<aside class="is-detail">
				<!-- D-942 (06/09/2026): no celular em pe o detalhe vira uma FOLHA
				     por cima da arvore, e este botao e o caminho de volta. Fora da
				     HUD vertical ele nao existe (display:none no CSS) - no desktop
				     o painel e fixo ao lado e nao ha o que voltar. -->
				<button type="button" class="is-voltar-detalhe" title="Voltar para a árvore">
					<span aria-hidden="true">‹</span> Voltar para a árvore
				</button>
				<div class="is-detail-scroll ri-scroll">
					<div class="is-empty">Selecione uma habilidade.</div>
				</div>
				<div class="is-detail-footer"></div>
			</aside>
		</div>

		<div class="is-footer">
			<div class="is-footer-left"></div>
			<div class="is-problemas"></div>
			<div class="is-footer-right">
				<span class="is-pontos-pill ri-badge ri-badge--ouro">Pontos de habilidade: 0</span>
				<button type="button" class="is-btn-resetar ri-btn ri-btn--sec" disabled>Resetar</button>
				<button type="button" class="is-btn-aplicar ri-btn" disabled>Aplicar</button>
			</div>
		</div>
	</div>
</div>
