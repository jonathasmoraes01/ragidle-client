<div id="HuntMap">
	<button type="button" class="hm-button" title="Mapa de Caça" aria-label="Mapa de Caça"><!--RI_ICONE:caca--></button>

	<div class="hm-window ri-window ri-anima">
		<div class="hm-titlebar ri-header">
			<span class="hm-title ri-title">Mapa de Caça</span>
			<button type="button" class="hm-close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="hm-toolbar">
			<label class="hm-search-wrap">
				<span class="hm-search-icon"><!--RI_ICONE:busca--></span>
				<input
					type="text"
					class="hm-search ri-input"
					placeholder="Mapa, monstro ou drop"
					aria-label="Buscar mapa, monstro ou drop"
					autocomplete="off"
				/>
				<button type="button" class="hm-search-clear" aria-label="Limpar busca" hidden><!--RI_ICONE:fechar--></button>
			</label>
			<div class="hm-seg hm-modo" role="tablist" aria-label="Quais mapas mostrar">
				<button type="button" class="hm-seg-btn" data-modo="ideais" role="tab">Para mim</button>
				<button type="button" class="hm-seg-btn" data-modo="todos" role="tab">Todos</button>
			</div>
			<div class="hm-sort-wrap">
				<label for="hm-sort-select">Ordem</label>
				<select id="hm-sort-select" class="hm-sort">
					<option value="nivel">Nível</option>
					<option value="nivel-recomendado">Para meu nível</option>
					<option value="nome">Nome</option>
				</select>
			</div>
		</div>

		<!-- A BARRA DE PASSO — só do celular em pé (08/09/2026).

		     No desktop o Mapa de Caça é uma janela de TRÊS COLUNAS (regiões |
		     lista | dossiê) e não existe "passo": tudo está à vista ao mesmo
		     tempo, e esta barra fica `display:none`.

		     Num celular de 393px as três colunas não cabem lado a lado — elas
		     se SOBREPÕEM. Medido antes do conserto
		     (`scripts/diag-mobile-portrait.ts`): 29 controles do Mapa de Caça
		     respondiam a outro elemento no `elementFromPoint`, e os cobridores
		     eram os cartões e as miniaturas da própria janela caindo por cima
		     do trilho de regiões.

		     Então no celular a janela vira um caminho de três passos, o mesmo
		     desenho que D-942 deu à árvore de habilidades: região → mapas →
		     dossiê, com um "‹ Voltar" que desfaz um passo por vez. O título do
		     passo diz onde o jogador está, para "voltar" nunca ser um salto no
		     escuro. -->
		<div class="hm-passo" hidden>
			<button type="button" class="hm-voltar" aria-label="Voltar">‹ Voltar</button>
			<span class="hm-passo-titulo"></span>
		</div>

		<div class="hm-status" role="status"></div>

		<div class="hm-body">
			<nav class="hm-rail ri-scroll" aria-label="Regiões">
				<div class="hm-rail-label">Regiões</div>
				<div class="hm-tabs"></div>
				<div class="hm-voce"></div>
			</nav>

			<section class="hm-list-wrap">
				<div class="hm-count"></div>
				<div class="hm-list ri-scroll"></div>
			</section>

			<aside class="hm-panel">
				<div class="hm-panel-scroll ri-scroll">
					<div class="hm-panel-empty">Abra o mapa de caça para carregar o catálogo.</div>
				</div>
				<div class="hm-panel-footer"></div>
			</aside>
		</div>
	</div>
</div>
