<div id="Escape" class="ri-window">
	<div class="top ri-header">
		<button class="node" title="Mover janela"></button>
		<div class="title ri-title" data-text="1483">Select Option</div>
	</div>

	<div class="container">
		<!-- Rotulos abaixo eram desenhados DENTRO dos BMPs esc_0Na/b/c (pt-BR
		     "queimado" no pixel, ver Escape.css) — decodificados e citados
		     um a um no relatorio do builder que trocou este chrome. -->
		<button type="button" class="resurection ri-btn ri-btn--ouro">Ressuscitar</button>
		<button type="button" class="savepoint ri-btn">Voltar para Ponto de Retorno</button>
		<button type="button" class="charselect ri-btn ri-btn--sec">Selecionar Personagem</button>
		<button type="button" class="graphics ri-btn ri-btn--sec">Configurações de Vídeo</button>
		<button type="button" class="sound ri-btn ri-btn--sec">Configurações de Áudio</button>
		<button type="button" class="hotkey ri-btn ri-btn--sec">Configurações de Atalho</button>
		<!-- A barra de skills da HUD mobile premium (15/10/2026): nasce desligada, e as tres skills do
		     rodizio ficam em volta do Auto. So existe na premium (Escape.css). -->
		<button type="button" class="barra-skills ri-btn ri-btn--sec" aria-pressed="false">Barra de skills: Desligada</button>
		<!-- O jogo em ingles (D-1929): bilingue e fora do tradutor, para quem
		     trocou sem querer achar o caminho de volta. -->
		<button type="button" class="idioma ri-btn ri-btn--sec" translate="no">Idioma · Language</button>
		<!-- INSTALAR O JOGO (16/10/2026): a porta do D-933 ("botao Instalar
		     proprio dentro de Configuracoes") morava na janela Idle e saiu com
		     ela (df1636c9). Nasce escondido; quem decide se aparece e o que o
		     clique faz e `UI/ofertaDeInstalacao.js` (instalarNoSistema.js). -->
		<button type="button" class="instalar ri-btn ri-btn--sec" hidden>Instalar o jogo</button>
		<p class="instalar-dica" role="status" hidden></p>
		<button type="button" class="exit ri-btn ri-btn--sec">Fechar Jogo</button>
		<button type="button" class="cancel ri-btn">Continuar a Jogar</button>
	</div>
</div>
