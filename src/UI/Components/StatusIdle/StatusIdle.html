<div id="StatusIdle">
	<div class="st-window ri-window ri-anima">
		<div class="st-titlebar ri-header">
			<span class="st-title ri-title">Status</span>
			<button type="button" class="st-close ri-close" title="Fechar">&times;</button>
		</div>

		<!-- O AVISO DE FICHA AUSENTE (achado da auditoria de 30/08/2026).

		     Ate esta data a janela abria com o markup ESTATICO desta pagina — STR 1,
		     custo 2, ATK 0, peso 0/0 — e ficava assim se o retrato nao chegasse: se o
		     JSON viesse quebrado, se o contrato viesse na v1, ou se o servidor
		     simplesmente nao respondesse. Nada na tela distinguia "o servidor ainda
		     nao falou" de "voce e um Aprendiz recem-criado", e os dois desenhos sao
		     identicos.

		     E o pior caso desde D-852: o que o jogador ve nao e so um numero, e uma
		     ficha detalhada com tooltip de parcelas — uma explicacao confiante sobre
		     um personagem que nao existe.

		     Quem liga e desliga isto e a classe do `.st-window` (`is-carregando` /
		     `is-quebrada`), e nao este elemento: o corpo inteiro esmaece junto, para
		     que nenhum numero placeholder seja lido como dado. -->
		<div class="st-aviso" role="status">
			<span class="st-aviso-texto">Esperando a ficha do servidor…</span>
		</div>

		<div class="st-body ri-scroll">
			<div class="st-card ri-card">
				<div class="st-card-title">Personagem</div>
				<div class="st-char-top">
					<div class="st-avatar-frame">
						<div class="st-avatar">
							<img class="st-avatar-img" alt="" />
							<span class="st-avatar-initial">?</span>
						</div>
					</div>
					<div class="st-char-identity">
						<div class="st-char-name">—</div>
						<div class="st-char-class">—</div>
					</div>
				</div>
				<div class="st-char-rows">
					<div class="st-char-pair">
						<div class="st-char-stat"><span class="st-char-label">Base Lv.</span><span class="st-char-value st-char-blvl">1</span></div>
						<div class="st-char-stat"><span class="st-char-label">Job Lv.</span><span class="st-char-value st-char-jlvl">1</span></div>
					</div>
					<div class="st-char-stat st-char-stat--full"><span class="st-char-label">Guild</span><span class="st-char-value st-guild">—</span></div>
					<div class="st-char-pair">
						<div class="st-char-stat"><span class="st-char-label">Zeny</span><span class="st-char-value st-char-zeny">0</span></div>
						<div class="st-char-stat"><span class="st-char-label">Peso</span><span class="st-char-value st-char-weight">0 / 0</span></div>
					</div>
				</div>
			</div>

			<!-- ".st-stat-total" embrulha o par "base + bonus" (contrato v2) para os
			     dois numeros andarem juntos com um respiro proprio, menor que o
			     gap de 8px de ".st-stat-right" — sem ele o "+10" flutuaria a meio
			     caminho do "custo" e leria como um terceiro campo.
			     ".st-stat-bonus" nasce VAZIA: renderFicha() so a preenche quando o
			     bonus e diferente de zero (mesma regra do cliente nativo,
			     WinStatsCommon.js:346 — string vazia quando val === 0).
			     O texto do title (a dobra por fonte) tambem e escrito por
			     renderFicha(), na linha ".st-stat-row" inteira. -->
			<div class="st-card ri-card">
				<div class="st-card-title">Atributos</div>
				<div class="st-stat-row" data-stat="forca">
					<span class="st-stat-label">STR</span>
					<span class="st-stat-right">
						<span class="st-stat-total"><span class="st-stat-value">1</span><span class="st-stat-bonus st-bonus"></span></span>
						<span class="st-stat-cost">2</span>
						<button type="button" class="st-stat-up" data-status-id="13" title="Aumentar STR">+</button>
					</span>
				</div>
				<div class="st-stat-row" data-stat="agilidade">
					<span class="st-stat-label">AGI</span>
					<span class="st-stat-right">
						<span class="st-stat-total"><span class="st-stat-value">1</span><span class="st-stat-bonus st-bonus"></span></span>
						<span class="st-stat-cost">2</span>
						<button type="button" class="st-stat-up" data-status-id="14" title="Aumentar AGI">+</button>
					</span>
				</div>
				<div class="st-stat-row" data-stat="vitalidade">
					<span class="st-stat-label">VIT</span>
					<span class="st-stat-right">
						<span class="st-stat-total"><span class="st-stat-value">1</span><span class="st-stat-bonus st-bonus"></span></span>
						<span class="st-stat-cost">2</span>
						<button type="button" class="st-stat-up" data-status-id="15" title="Aumentar VIT">+</button>
					</span>
				</div>
				<div class="st-stat-row" data-stat="inteligencia">
					<span class="st-stat-label">INT</span>
					<span class="st-stat-right">
						<span class="st-stat-total"><span class="st-stat-value">1</span><span class="st-stat-bonus st-bonus"></span></span>
						<span class="st-stat-cost">2</span>
						<button type="button" class="st-stat-up" data-status-id="16" title="Aumentar INT">+</button>
					</span>
				</div>
				<div class="st-stat-row" data-stat="destreza">
					<span class="st-stat-label">DEX</span>
					<span class="st-stat-right">
						<span class="st-stat-total"><span class="st-stat-value">1</span><span class="st-stat-bonus st-bonus"></span></span>
						<span class="st-stat-cost">2</span>
						<button type="button" class="st-stat-up" data-status-id="17" title="Aumentar DEX">+</button>
					</span>
				</div>
				<div class="st-stat-row" data-stat="sorte">
					<span class="st-stat-label">LUK</span>
					<span class="st-stat-right">
						<span class="st-stat-total"><span class="st-stat-value">1</span><span class="st-stat-bonus st-bonus"></span></span>
						<span class="st-stat-cost">2</span>
						<button type="button" class="st-stat-up" data-status-id="18" title="Aumentar LUK">+</button>
					</span>
				</div>
			</div>

			<!-- ATK/MATK/DEF/MDEF sao as QUATRO que o RO escreve em duas metades
			     ("30 + 55"), e por isso levam ".st-info-row--metades" +
			     "data-derivado" — o segundo e a chave em `derivados.metades` e
			     tambem o que renderFicha() usa para achar a linha e escrever o
			     title. HIT/CRI/FLEE/ASPD nao tem metade nenhuma e ficam como
			     estavam, com o valor direto em ".st-info-value".
			     A metade da direita ("...2", nome herdado do atak2/def2/mdef2 do
			     cliente nativo) e SEMPRE escrita, inclusive quando vale zero —
			     ao contrario do bonus de atributo. Ver WinStatsCommon.js:302-312. -->
			<div class="st-card ri-card">
				<div class="st-card-title">Estatísticas</div>
				<div class="st-info-grid">
					<div class="st-info-row st-info-row--metades" data-derivado="atk"><span class="st-info-label">ATK</span><span class="st-info-value"><span class="st-atk">0</span><span class="st-atk2 st-bonus"></span></span></div>
					<div class="st-info-row st-info-row--metades" data-derivado="matk"><span class="st-info-label">MATK</span><span class="st-info-value"><span class="st-matk">0</span><span class="st-matk2 st-bonus"></span></span></div>
					<div class="st-info-row"><span class="st-info-label">HIT</span><span class="st-info-value st-hit">0</span></div>
					<div class="st-info-row"><span class="st-info-label">CRI</span><span class="st-info-value st-cri">0</span></div>
					<div class="st-info-row st-info-row--metades" data-derivado="def"><span class="st-info-label">DEF</span><span class="st-info-value"><span class="st-def">0</span><span class="st-def2 st-bonus"></span></span></div>
					<div class="st-info-row st-info-row--metades" data-derivado="mdef"><span class="st-info-label">MDEF</span><span class="st-info-value"><span class="st-mdef">0</span><span class="st-mdef2 st-bonus"></span></span></div>
					<div class="st-info-row"><span class="st-info-label">FLEE</span><span class="st-info-value st-flee">0</span></div>
					<div class="st-info-row"><span class="st-info-label">ASPD</span><span class="st-info-value st-aspd">0</span></div>
				</div>
			</div>
		</div>

		<!-- O botao "Distribuir Automatico" SAIU em 28/08/2026, a pedido do dono.
		     Ele gastava TODOS os pontos de uma vez pelo plano da classe, e o
		     jogador que clicasse sem querer nao tinha como desfazer: o unico
		     caminho de volta e o `@resetstat` do administrador. O rodape fica so
		     com a contagem, que e o que ele precisa dizer.

		     O pacote (CZ_RAGIDLE_DISTRIBUIR, 0x0ffe) e o handler do servidor
		     CONTINUAM vivos — quem tirou foi a porta, e nao a peca. -->
		<div class="st-footer">
			<div class="st-points-row">Pontos de Atributo: <span class="st-points">0</span></div>
		</div>
	</div>
</div>
