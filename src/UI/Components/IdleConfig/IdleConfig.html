<div id="IdleConfig">
	<button type="button" class="ic-button" title="Configuração idle" aria-label="Configuração idle"><!--RI_ICONE:config--></button>

	<div class="ic-window ri-window ri-anima">
		<div class="ic-titlebar ri-header">
			<span class="ic-title ri-title">Configuração idle</span>
			<button type="button" class="ic-close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="ic-master"></div>

		<!-- D-933: instalar o jogo. Nasce ESCONDIDO e so aparece quando ha o que
		     fazer — no Chrome/Android quando o navegador oferece a instalacao, no
		     Safari do iPhone com a instrucao (la nao existe evento nenhum). Quem
		     ja instalou nao ve nada: o pedido do dono e explicito contra banner
		     intrusivo, e um botao que nao faz nada e a versao permanente disso. -->
		<div class="ic-instalar" hidden>
			<div class="ic-instalar-texto">
				<strong class="ic-instalar-titulo">Instalar o jogo</strong>
				<span class="ic-instalar-sub"></span>
			</div>
			<button type="button" class="ic-instalar-btn ri-btn">Instalar</button>
		</div>

		<div class="ic-status" role="status"></div>

		<div class="ic-body">
			<nav class="ic-rail ri-scroll" aria-label="Seções">
				<div class="ic-rail-label">Seções</div>
				<button type="button" class="ic-tab is-active" data-tab="caca">
					<span class="ic-tab-icon"><!--RI_ICONE:alvo--></span>
					<span class="ic-tab-text">
						<span class="ic-tab-name">Caçada</span>
						<span class="ic-tab-sum" data-resumo="caca"></span>
					</span>
				</button>
				<button type="button" class="ic-tab" data-tab="ataque">
					<span class="ic-tab-icon"><!--RI_ICONE:espadas--></span>
					<span class="ic-tab-text">
						<span class="ic-tab-name">Ataque</span>
						<span class="ic-tab-sum" data-resumo="ataque"></span>
					</span>
				</button>
				<button type="button" class="ic-tab" data-tab="suporte">
					<span class="ic-tab-icon"><!--RI_ICONE:brilhos--></span>
					<span class="ic-tab-text">
						<span class="ic-tab-name">Suporte</span>
						<span class="ic-tab-sum" data-resumo="suporte"></span>
					</span>
				</button>
				<button type="button" class="ic-tab" data-tab="sobrevivencia">
					<span class="ic-tab-icon"><!--RI_ICONE:coracao--></span>
					<span class="ic-tab-text">
						<span class="ic-tab-name">Sobrevivência</span>
						<span class="ic-tab-sum" data-resumo="sobrevivencia"></span>
					</span>
				</button>
				<button type="button" class="ic-tab" data-tab="consumiveis">
					<span class="ic-tab-icon"><!--RI_ICONE:frasco--></span>
					<span class="ic-tab-text">
						<span class="ic-tab-name">Consumíveis</span>
						<span class="ic-tab-sum" data-resumo="consumiveis"></span>
					</span>
				</button>
				<div class="ic-rail-foot"></div>
			</nav>

			<section class="ic-pane ri-scroll">
				<div class="ic-empty">Abra a configuração idle para carregar.</div>
			</section>
		</div>

		<div class="ic-footer">
			<div class="ic-problemas"></div>
			<div class="ic-pendentes"></div>
			<button type="button" class="ic-apply ri-btn" disabled>Aplicar</button>
		</div>
	</div>
</div>
