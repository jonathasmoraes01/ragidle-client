<div id="IdleConfig">
	<button type="button" class="ic-button" title="Configuração idle">⚙</button>

	<div class="ic-window">
		<div class="ic-titlebar">
			<span class="ic-title">Configuração idle</span>
			<button type="button" class="ic-close" title="Fechar">&times;</button>
		</div>

		<div class="ic-tabs">
			<button type="button" class="ic-tab is-active" data-tab="geral">Geral</button>
			<button type="button" class="ic-tab" data-tab="alvos">Alvos</button>
			<button type="button" class="ic-tab" data-tab="skills">Skills</button>
			<button type="button" class="ic-tab" data-tab="recuperacao">Recuperação</button>
			<button type="button" class="ic-tab" data-tab="itens">Itens</button>
		</div>

		<div class="ic-status"></div>

		<div class="ic-body">
			<div class="ic-empty">Abra a configuração idle para carregar.</div>
		</div>

		<div class="ic-footer">
			<div class="ic-problemas"></div>
			<button type="button" class="ic-apply" disabled>Aplicar</button>
		</div>
	</div>
</div>
