<div id="IdleConfig">
	<button type="button" class="ic-button" title="Configuração idle">⚙</button>

	<div class="ic-window ri-window">
		<div class="ic-titlebar ri-header">
			<span class="ic-title ri-title">Configuração idle</span>
			<button type="button" class="ic-close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="ic-tabs">
			<button type="button" class="ic-tab ri-tab is-active" data-tab="geral">Geral</button>
			<button type="button" class="ic-tab ri-tab" data-tab="alvos">Alvos</button>
			<button type="button" class="ic-tab ri-tab" data-tab="skills">Skills</button>
			<button type="button" class="ic-tab ri-tab" data-tab="recuperacao">Recuperação</button>
			<button type="button" class="ic-tab ri-tab" data-tab="itens">Itens</button>
		</div>

		<div class="ic-status"></div>

		<div class="ic-body ri-scroll">
			<div class="ic-empty">Abra a configuração idle para carregar.</div>
		</div>

		<div class="ic-footer">
			<div class="ic-problemas"></div>
			<button type="button" class="ic-apply ri-btn" disabled>Aplicar</button>
		</div>
	</div>
</div>
