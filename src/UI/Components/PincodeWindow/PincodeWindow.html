<!-- Fase 3 (01/09/2026): a janela de PIN sai dos 53 bitmaps (titlebar_mid,
     2ndpassword_bg, 0..9-a/b/c, reset-a/b/c, btn_big_*) e entra no design
     system. Ganchos que PincodeWindow.js consulta, todos preservados:
     .titlebar .base (arrasto) / .btn.num0..num9 (posicao lida por
     offsetTop/offsetLeft para o embaralhar anti-keylogger — POSICAO
     ABSOLUTA INTOCAVEL) / .numReset / .pass .newpass .checkpass / .btn2.ok
     .btn2.change .btn2.verify .btn2.unused .btn2.cancel. Os digitos que
     eram desenhados no bitmap (1-a.bmp..0-a.bmp) agora sao o texto do
     proprio botao. -->
<div id="Pincodewindow">
	<div class="titlebar">
		<div class="left">
			<span class="base" aria-hidden="true"></span>
			<span class="text" data-text="1899">Pincodewindow</span>
		</div>
		<div class="clear"></div>
	</div>
	<div class="panel">
		<span class="txtlabel text1" data-text="1905">Pincodewindow</span>
		<span class="txtlabel text2" data-text="1906">Pincodewindow</span>
		<button type="button" class="btn num1">1</button>
		<button type="button" class="btn num2">2</button>
		<button type="button" class="btn num3">3</button>
		<button type="button" class="btn num4">4</button>
		<button type="button" class="btn num5">5</button>
		<button type="button" class="btn num6">6</button>
		<button type="button" class="btn num7">7</button>
		<button type="button" class="btn num8">8</button>
		<button type="button" class="btn num9">9</button>
		<button type="button" class="btn num0">0</button>
		<button type="button" class="numReset">Limpar</button>
		<!-- PIN em type=text mascarado por CSS (.ri-senha-mascarada), NUNCA
		     type=password: um type=password montado faz o Chrome oferecer a
		     senha salva da CONTA aqui e em toda caixa de texto da pagina
		     (ver o escudo em GUIComponent.js). -->
		<span class="txtlabel pwd" data-text="1012">Pincodewindow</span>
		<input class="pass ri-senha-mascarada" type="text" value="" />
		<span class="txtlabel newpwd" data-text="1013">Pincodewindow</span>
		<input class="newpass ri-senha-mascarada" type="text" value="" />
		<span class="txtlabel checkpwd" data-text="1014">Pincodewindow</span>
		<input class="checkpass ri-senha-mascarada" type="text" value="" />
		<button type="button" class="btn2 ok">Confirmar</button>
		<button type="button" class="btn2 change">Alterar</button>
		<button type="button" class="btn2 verify">Avançar</button>
		<button type="button" class="btn2 unused">—</button>
		<button type="button" class="btn2 cancel">Cancelar</button>
	</div>
	<div class="footer"></div>
</div>
