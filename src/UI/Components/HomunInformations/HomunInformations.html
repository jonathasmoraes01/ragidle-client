<!-- Fase 3 (01/09/2026): a janela de Info do Homúnculo saiu do bitmap de
     fundo (homuninfo_bg.bmp) e dos botões pintados (btn_rewrite/btn_skill/
     btn_del/btn_feed/sys_close_*) e entrou no design system. Ganchos que
     HomunInformations.js consulta, todos preservados: .content (arraste +
     contêiner) / .base / .close / .name / .modify / .level / .skill / .del /
     .stats .atk/.Matk/.hit/.critical/.def/.Mdef/.flee/.aspd / .hp_bar* /
     .hp_value/.hp_max_value/.hp_perc / .hp2 / .sp_bar* /
     .sp_value/.sp_max_value/.sp_perc / .sp2 / .block2 .title_exp/.exp/
     .title_hunger/.hunger/.title_intimacy/.intimacy / .feed / .feeding /
     .homun_auto_feed. As barras de HP/SP (3 pedaços em bitmap gze*_left/mid/
     right, coloridas pelo JS) e os canvas de EXP/fome continuam vindo do JS
     — não são cor literal de CSS deste arquivo. -->
<div id="HomunInformations" class="ri-window">
	<div class="content">
		<div class="hi-titulo">
			<span class="text ri-title">Homúnculo</span>
			<button type="button" class="base close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="title_name">Nome</div>
		<input type="text" class="name" value="" />
		<div class="title_level">Nível</div>
		<div class="level"></div>

		<button type="button" class="modify ri-btn ri-btn--sec">Renomear</button>
		<button type="button" class="skill ri-btn ri-btn--sec">Skills</button>
		<button type="button" class="del ri-btn ri-btn--sec">Excluir</button>

		<div class="stats">
			<div class="atk"></div>
			<div class="Matk"></div>
			<div class="hit"></div>
			<div class="critical"></div>
			<div class="def"></div>
			<div class="Mdef"></div>
			<div class="flee"></div>
			<div class="aspd"></div>
		</div>

		<div class="hp_bar">
			<div class="hp_bar_left"></div>
			<div class="hp_bar_middle"></div>
			<div class="hp_bar_right"></div>
			<div class="hp_bar_perc"><span class="hp_value"></span> / <span class="hp_max_value"></span></div>
		</div>
		<div class="hp2"></div>

		<div class="sp_bar">
			<div class="sp_bar_left"></div>
			<div class="sp_bar_middle"></div>
			<div class="sp_bar_right"></div>
			<div class="sp_bar_perc"><span class="sp_value"></span> / <span class="sp_max_value"></span></div>
		</div>
		<div class="sp2"></div>

		<div class="block2">
			<div class="title_exp">
				EXP
				<div class="exp"></div>
			</div>
			<canvas class="life title_exp" width="60" height="5"></canvas>

			<div class="title_hunger">
				Fome
				<div class="hunger"></div>
			</div>
			<canvas class="life title_hunger" width="60" height="5"></canvas>

			<div class="title_intimacy">
				Intimidade
				<div class="intimacy"></div>
			</div>
		</div>

		<button type="button" class="feed ri-btn ri-btn--sec">Alimentar</button>
		<div class="feeding">
			<button class="homun_auto_feed" data-background="checkbox_0.bmp" data-preload="checkbox_1.bmp"></button>
			<ui-text msg="2577">Auto Feeding</ui-text>
		</div>

		<!--		<div class="title_accessory">Accessory</div>-->
		<!--		<div class="accessory">Equipped</div>-->
	</div>
</div>
