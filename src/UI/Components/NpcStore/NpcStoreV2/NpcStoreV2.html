<!-- A loja de NPC moderna (01/09/2026). UMA janela: lista com busca,
     quantidade na propria linha, total vivo, um botao primario. A organizacao
     vem do Ragnarok Origin (lista + total + acao unica, sem arrastar); a
     forma e 100% do nosso design system.

     Desde 02/09/2026 (D-920/D-921, pedido do dono) a lista e DIVIDIDA POR
     CATEGORIA (as abas nascem no JS, so as que tem item), tem controle de
     ORDEM (raridade, quantidade, preco, nome) e o rodape mostra o PESO que a
     compra acrescenta a mochila. O "Tudo no maximo" (D-922) age SO no que
     esta a vista — a aba escolhida e a busca em vigor — e vira "Limpar"
     quando ja esta tudo no teto.

     Ganchos de DOM que o MOTOR cutuca por seletor e por isso nao podem mudar
     de nome: .seller / .cashuser .buyer / .cashuser .cashpoints / .priceLimit
     (Engine/MapEngine/Store.js). As linhas da lista nascem no JS. -->
<div id="NpcStoreV2">
	<div class="ns-window ri-window">
		<div class="ns-header ri-header">
			<span class="ns-title ri-title">Loja</span>
			<button type="button" class="ns-fechar ri-close" title="Fechar">&times;</button>
		</div>

		<div class="ns-sub">
			<span class="ns-vendedor" hidden>com <span class="seller"></span></span>
			<span class="cashuser" hidden>
				<span class="buyer"></span> &middot; <span class="cashpoints">0</span>
				<span class="unity">Pontos</span>
			</span>
			<span class="priceLimit" hidden></span>
			<span class="ns-bolsa" hidden>
				Você tem <b class="ns-bolsa-valor">0</b> <span class="ns-bolsa-unidade">Zeny</span>
			</span>
		</div>

		<div class="ns-ferramentas">
			<input class="ns-busca ri-input" type="text" aria-label="Buscar item pelo nome" placeholder="Buscar item…" />
			<label class="ns-ordem-rotulo">
				<span class="ns-ordem-texto">Ordenar</span>
				<select class="ns-ordem" aria-label="Ordenar a lista"></select>
			</label>
		</div>

		<div class="ns-filtros">
			<div class="ns-abas" role="tablist"></div>
			<button type="button" class="ns-tudo ri-btn ri-btn--sec" disabled>Tudo no máx</button>
			<!--
				"Desmarcar tudo" (16/10/2026): o desfazer da acao em massa, SEMPRE a
				vista quando ha alguma coisa marcada, em qualquer aba. A "Lista
				inteira" (que enchia as abas que o jogador NAO estava vendo) saiu:
				com a aba ativa ela lia como "a lista que estou vendo". E o `hidden`
				dela nunca funcionou na venda: `.ri-btn` (Common.css) declara
				`display:inline-flex`, que vence o [hidden] do navegador.
			-->
			<button type="button" class="ns-desmarcar ri-btn ri-btn--sec" hidden>Desmarcar tudo</button>
		</div>

		<!--
			Quantos itens a TRAVA escondeu desta lista (18/09/2026). Sem esta
			linha o item travado sai da venda em silencio, e quem travou e
			esqueceu conclui que ele sumiu da mochila.
		-->
		<div class="ns-travados" hidden></div>

		<div class="ns-lista ri-scroll"></div>
		<div class="ns-vazio" hidden>Nenhum item encontrado.</div>

		<div class="ns-rodape">
			<div class="ns-resumo">
				<div class="ns-itens-escolhidos">Nada escolhido</div>
				<div class="ns-total" hidden>
					Total&nbsp;<b class="ns-total-valor">0</b>&nbsp;<span class="ns-unidade">Zeny</span>
				</div>
				<div class="ns-peso" hidden>
					Peso&nbsp;<b class="ns-peso-valor">0 / 0</b><span class="ns-peso-delta"></span>
				</div>
			</div>
			<button type="button" class="ns-agir ri-btn" disabled>Comprar</button>
		</div>
	</div>

	<!--
		A CONFIRMACAO DA VENDA (16/10/2026). Um modal DENTRO da janela, e nao o
		prompt generico: ele lista o que vai sumir, marca as linhas arriscadas e
		nasce com o foco no "Cancelar". As linhas nascem no JS
		(`abrirConfirmacao`, NpcStoreV2.js; a regra em `confirmacaoDaVenda.js`).
	-->
	<div class="ns-conf" role="dialog" aria-modal="true" aria-labelledby="ns-conf-titulo" hidden>
		<div class="ns-conf-cartao">
			<div class="ns-conf-titulo" id="ns-conf-titulo">Confirmar venda</div>
			<div class="ns-conf-avisos"></div>
			<div class="ns-conf-lista ri-scroll" role="list"></div>
			<div class="ns-conf-total">
				<span class="ns-conf-total-rotulo">Total</span>
				<b class="ns-conf-total-valor">0 z</b>
			</div>
			<div class="ns-conf-nota">Isto não tem desfazer.</div>
			<div class="ns-conf-acoes">
				<button type="button" class="ns-conf-cancelar ri-btn ri-btn--sec">Cancelar</button>
				<button type="button" class="ns-conf-vender ri-btn">Vender</button>
			</div>
		</div>
	</div>
</div>
