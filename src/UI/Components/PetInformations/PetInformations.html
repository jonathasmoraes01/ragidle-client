<!-- Fase 3 (01/09/2026): a janela de Info do Pet saiu dos bitmaps de moldura
     (titlebar_mid.bmp, sys_close_*.bmp, btn_edit*.bmp) e entrou no design
     system. Ganchos que PetInformations.js consulta, todos preservados:
     .titlebar (arraste) / .close / .content / .name / .modify / .level /
     .hunger / .intimacy / .accessory / .feeding / .pet_auto_feed / .command.
     A ilustração do pet continua sendo pintada pelo JS como
     background-image de .content (arte real do GRF, não cor de CSS). -->
<div id="PetInformations" class="ri-window">
	<div class="titlebar ri-header">
		<span class="text ri-title" data-text="584">Pet Info</span>
		<button type="button" class="base close ri-close" title="Fechar">&times;</button>
	</div>
	<div class="content">
		<div class="title_name">Nome</div>
		<input type="text" class="name" value="" />
		<div class="title_level">Nível</div>
		<div class="level"></div>
		<button type="button" class="modify ri-btn ri-btn--sec">Editar</button>

		<div class="title_hunger">Fome</div>
		<div class="hunger"></div>
		<div class="title_intimacy">Intimidade</div>
		<div class="intimacy"></div>

		<div class="title_accessory">Acessório</div>
		<div class="accessory">Equipado</div>
		<div class="feeding">
			<span data-text="2577">Auto Feeding</span
			><button class="pet_auto_feed" data-background="checkbox_0.bmp" data-preload="checkbox_1.bmp"></button>
		</div>

		<select class="command ri-input">
			<option value="default">&lt; Comando &gt;</option>
			<option value="feed" data-text="592">Feed Pet</option>
			<option value="action" data-text="593">Performance</option>
			<option value="release" data-text="594">Return to Egg Shell</option>
			<option value="unequip" data-text="595">Unequip Accessory</option>
		</select>
	</div>
</div>
