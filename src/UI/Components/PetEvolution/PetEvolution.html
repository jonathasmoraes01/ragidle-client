<!-- Fase 3 (01/09/2026): a janela de Evolução de Pet saiu dos bitmaps de
     moldura (titlebar_mid.bmp, sys_close_*.bmp, btn_ok*.bmp, btn_cancel*.bmp)
     e entrou no design system. Ganchos que PetEvolution.js consulta, todos
     preservados: .titlebar (arraste) / .close / .base_pet_illust /
     .target_pet_illust / .base_petEggId / .target_petEggId /
     .evo_requirements / .evolve / .big_cancel. As ilustrações do pet
     continuam sendo pintadas pelo JS (arte real do GRF). -->
<div id="PetEvolution" class="ri-window">
	<div class="titlebar ri-header">
		<span class="text ri-title" data-text="2567">Pet Evolution</span>
		<button type="button" class="base close ri-close" title="Fechar">&times;</button>
	</div>
	<div class="content">
		<div class="pet_illust_holder">
			<div class="base_pet_illust ri-tile"></div>
			<div class="next">▶</div>
			<div class="target_pet_illust ri-tile"></div>
		</div>
		<div class="pet_eggID_holder">
			<div class="base_petEggId"></div>
			<div class="target_petEggId"></div>
		</div>
		<div class="evo_requirements ri-scroll"></div>
		<div class="footer">
			<button type="button" class="evolve ri-btn">Evoluir</button>
			<button type="button" class="big_cancel ri-btn ri-btn--sec">Cancelar</button>
		</div>
	</div>
</div>
