<!-- Fase 3 (01/09/2026): a janela de Reputação saiu dos bitmaps de moldura
     (titlebar_mid.bmp, sys_base_*.bmp, sys_close_*.bmp, btnbar_mid2.bmp,
     btn_close*.bmp, btn_search*.bmp, arrow_*.bmp) e entrou no design system.
     Ganchos que Reputation.js consulta, todos preservados: .titlebar
     (arraste) / .base (para-propagação de mousedown) / .close /
     .big_btn_close / #repute_groups / .rep_group_searchbar / .search /
     .rep_group_total_points_wrapper / .rep_indicator /
     .rep_group_total_points_value / .content / .page_prev / .page_next /
     .page_text. Os cartões de reputação (.rep_group_wrapper, os indicadores
     de luz e a barra de progresso) continuam vindo de bitmap/gradiente
     aplicados pelo PRÓPRIO JS (Client.loadFile + backgroundImage) — não são
     cor literal de CSS deste arquivo, então ficaram como estavam. -->
<div id="Reputation" class="ri-window">
	<div class="titlebar ri-header">
		<ui-text class="text ri-title" msg="3827"></ui-text>
		<button type="button" class="base close ri-close" title="Fechar">&times;</button>
	</div>
	<div class="overall_container">
		<div class="header">
			<div class="select-wrapper">
				<select id="repute_groups" class="rep_group_selector ri-input">
					<option value="all" data-text="3829"></option>
				</select>
				<ui-button
					class="select-arrow"
					bg="basic_interface/txtbox_btn_a.bmp"
					hover="basic_interface/txtbox_btn_b.bmp"
					down="basic_interface/txtbox_btn_c.bmp"
				></ui-button>
			</div>
			<div class="search_wrapper">
				<input class="rep_group_searchbar ri-input" type="text" placeholder="Buscar…" />
				<button type="button" class="search ri-btn">Buscar</button>
			</div>
			<div class="rep_group_total_points_wrapper">
				<div class="rep_group_text">GRUPO:</div>
				<div class="rep_indicator"></div>
				<div class="rep_group_total_points_value"></div>
			</div>
		</div>
		<div class="content ri-scroll"></div>
		<div class="paginator">
			<button type="button" class="page_prev" title="Página anterior">&lsaquo;</button>
			<span class="page_text">1 / 1</span>
			<button type="button" class="page_next" title="Próxima página">&rsaquo;</button>
		</div>
		<div class="footer">
			<button type="button" class="big_btn_close ri-btn">Fechar</button>
		</div>
	</div>
</div>
