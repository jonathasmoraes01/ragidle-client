<!-- REFINAR EQUIPAMENTO — a bancada (07/09/2026).

     ================================================================
     POR QUE ESTA JANELA FOI REFEITA, E NAO AJUSTADA
     ================================================================
     Queixa do dono, com print: *"a gente coloca o item, seleciona o
     material e clica, e nao tem o botao de refinar"*.

     A janela anterior herdava o desenho NATIVO do RO, e nele a peca
     entra por ARRASTO da mochila para um encaixe na bigorna. Todo o
     caminho ate o botao dependia de tres coisas darem certo em
     sequencia, e o jogador nao via nenhuma delas falhar:

       1. arrastar da mochila para o encaixe (`onItemDrop`);
       2. clicar no ladrilho do material — e esse clique morria calado
          com `if (clickedCount === 0) return`, ou seja, **quem nao
          tinha o minerio clicava e nao acontecia nada**;
       3. so entao `.refine_enabled` recebia `display:block`. O botao
          "Refinar" nao estava desabilitado: ele NAO EXISTIA na tela
          ate o passo 2 dar certo. Dai a frase do dono ser literal.

     E havia um quarto silencio, do lado do servidor: peca vestida,
     peca no teto e peca fora da tabela faziam o `CZ_REFINING_SELECT_ITEM`
     RETORNAR sem responder. A janela ficava mostrando o degrau da peca
     anterior enquanto o jogador achava que tinha escolhido esta.

     O desenho novo nao tem nenhum desses degraus:
       - a peca entra por CLIQUE numa lista que ja mostra o que da para
         refinar (nada de arrasto — que, alem do mais, nao existe no
         toque: D-938);
       - o material nao se escolhe. O degrau tem UM material, dito pelo
         `refine.yml`; a janela mostra quanto voce tem e quanto precisa;
       - o botao esta SEMPRE na tela, e quando esta apagado o rodape diz
         POR QUE em portugues, ao lado dele.

     ================================================================
     O QUE E ARTE E O QUE E MOLDURA (regra 4 do CLAUDE.md)
     ================================================================
     A moldura, as abas, os ladrilhos, a barra e os botoes sao CSS nos
     tokens do design system. O que carrega informacao continua sendo o
     PNG do cliente: o icone de item (24x24, ampliacao inteira) e a
     FORNALHA do GRF, que aqui e uma faixa de cena (`.rf-palco`) com a
     peca pousada em cima — o mesmo recorte medido em 01/09/2026
     (`background-position: 0 -120px`, palco de 122px: entra a fornalha
     com as duas fileiras de encaixe, ficam de fora o painel de cima e
     as plaquinhas dos botoes).

     A sequencia de animacao (espera -> pronto -> processo ->
     sucesso/falha) continua rodando no palco, intacta.
-->
<div id="Refine">
	<div class="rf-header ri-header">
		<span class="rf-titulo ri-title">Refinar equipamento</span>
		<button type="button" class="rf-close ri-close" title="Fechar">&times;</button>
	</div>

	<div class="rf-corpo">
		<!-- ─── O TRILHO: o que voce tem para refinar ──────────────── -->
		<section class="rf-trilho" aria-label="Equipamento refinavel">
			<header class="rf-trilho-topo">
				<h2 class="rf-secao">Sua mala</h2>
				<span class="rf-conta" aria-hidden="true">0</span>
			</header>

			<div class="rf-abas" role="tablist" aria-label="Filtrar por tipo">
				<button type="button" role="tab" aria-selected="true" class="ri-tab rf-aba is-active" data-aba="todos">Tudo</button>
				<button type="button" role="tab" aria-selected="false" class="ri-tab rf-aba" data-aba="armas">Armas</button>
				<button type="button" role="tab" aria-selected="false" class="ri-tab rf-aba" data-aba="armaduras">Defesa</button>
			</div>

			<!-- role="listbox": as pecas sao uma ESCOLHA, e o leitor de tela
			     precisa saber qual esta escolhida. O JS mantem aria-selected. -->
			<ul class="rf-lista ri-scroll" role="listbox" tabindex="0" aria-label="Peças"></ul>

			<p class="rf-lista-vazia" hidden>Nada aqui ainda.</p>
		</section>

		<!-- ─── A BANCADA: a peca escolhida, o degrau e o risco ────── -->
		<section class="rf-bancada" aria-label="A peça escolhida">
			<div class="rf-palco">
				<div class="rf-peca ri-tile is-empty"></div>
			</div>

			<div class="rf-ficha">
				<h3 class="rf-peca-nome">Escolha uma peça</h3>
				<p class="rf-peca-tipo">A lista ao lado mostra o que a forja aceita.</p>
			</div>

			<!-- A TRILHA: onde a peca esta na escada do refino. O concorrente
			     nao tem isto, e ela responde de relance a pergunta que o
			     numero sozinho nao responde — "quanto falta para o teto?". -->
			<div class="rf-trilha" role="img" aria-label="Progresso do refino"></div>

			<div class="rf-salto">
				<span class="rf-salto-de">+0</span>
				<span class="rf-salto-seta" aria-hidden="true"></span>
				<span class="rf-salto-para">+1</span>
				<span class="rf-salto-ganho" hidden></span>
			</div>

			<!-- A BARRA DE RISCO: verde = sucesso, vermelho = o que sobra.
			     Uma barra BIPARTIDA, e nao um numero grande: a decisao aqui e
			     "arrisco ou nao", e proporcao se le mais rapido que digito.
			     A porcentagem fica na emenda, com duas casas — a tabela do
			     rAthena guarda na grade de 10000 e 6000 e 60,00%. -->
			<div class="rf-risco">
				<div class="rf-risco-topo">
					<span class="rf-risco-rotulo">Chance de subir</span>
					<span class="rf-risco-valor">—</span>
				</div>
				<div class="rf-risco-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
					<div class="rf-risco-sucesso"></div>
				</div>
				<p class="rf-risco-nota">Escolha uma peça para ver o degrau.</p>
			</div>

			<!-- AS DUAS FICHAS. O material nao se escolhe: o degrau tem um
			     so, e o que a janela precisa dizer e quanto voce TEM dele.

			     Eram TRES ate a foto de 07/09: "Se falhar" era um cartao, e
			     com 263px de bancada os tres se espremiam a ponto de o nome
			     do minerio virar reticencia. A consequencia da falha subiu
			     para a NOTA do risco, que e onde ela pertence — ela e a outra
			     metade da mesma frase ("40% de subir" so significa alguma
			     coisa junto com "e se nao subir?"). -->
			<div class="rf-fatos">
				<div class="rf-fato rf-fato--material">
					<span class="rf-fato-rotulo">Material</span>
					<span class="rf-fato-corpo">
						<span class="rf-mat-icone ri-tile is-empty"></span>
						<span class="rf-mat-texto">—</span>
					</span>
				</div>
				<div class="rf-fato rf-fato--taxa">
					<span class="rf-fato-rotulo">Custo</span>
					<span class="rf-fato-corpo rf-taxa-valor">—</span>
				</div>
			</div>
		</section>
	</div>

	<div class="rf-rodape">
		<span class="rf-bolso">
			<span class="rf-bolso-rotulo">Bolso</span>
			<span class="rf-bolso-valor">—</span>
		</span>
		<!-- role="status": o motivo troca sozinho conforme a peca escolhida,
		     e e a unica coisa que explica um botao apagado. -->
		<span class="rf-motivo" role="status" aria-atomic="true"></span>
		<button type="button" class="rf-acao ri-btn is-disabled" disabled>Refinar</button>
	</div>
</div>
