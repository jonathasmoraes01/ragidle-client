<div id="CombatCornerIdle">
	<div class="cc-corner">
		<button
			type="button"
			class="cc-btn cc-btn--auto"
			data-action="auto"
			title="Ataque automático desligado: clique para ligar"
			aria-label="Ataque automático desligado: clique para ligar"
			aria-pressed="false"
		>
			<span class="cc-ring ri-glass"><!--RI_ICONE:auto--></span>
			<span class="cc-label">Ataque auto</span>
			<!-- D-939: no trilho do celular em pe o rotulo do mockup e "Auto"
			     (o trilho tem 60px de largura; "Ataque auto" transborda).
			     Escondido por padrao; so a HUD vertical o mostra. -->
			<span class="cc-label cc-label--v" aria-hidden="true">Auto</span>
		</button>
	</div>
	<!-- O ARCO DE SKILLS (15/10/2026, HUD mobile premium): as tres skills do
	     rodizio do Bot em volta do Auto (arcoDeSkills.js desenha os discos).
	     Fora da camada premium ele e `display: none` (CombatCornerIdle.css):
	     o desktop e a HUD vertical de D-939 nao mudam. -->
	<div class="cc-rodizio" role="group" aria-label="Skills do automático"></div>
</div>
