<!-- Fase 3 (01/09/2026): a loja de cash saiu dos bitmaps do GRF
     (img_shop_bg, tabs pintadas, botoes de seta) e entrou no design system.
     TODOS os ids/classes que CashShop.js consulta foram preservados:
     .titlebar .close / .titlebar .base / #panel-menu .tab[data-index] /
     #panel-items / .panel-pagination .go-* / .pagi-* / #cashshop-search(-btn)
     / .panel-cart / #cart-list .items / #cashpoint / .cashpoint_footer /
     .free-point / #use-free-points / #purchase-btn / .panel-cart-charge-btn /
     .overlay. As abas ganharam rotulo em TEXTO (era pintado no bitmap). -->
<div id="CashShop">
	<div class="titlebar ri-header">
		<div class="left">
			<span class="text ri-title">Loja de Cash</span>
		</div>
		<div class="right">
			<!-- .base e .close continuam: CashShop.js pendura listeners nelas -->
			<button type="button" class="base close ri-close" title="Fechar">&times;</button>
		</div>
	</div>
	<div class="panel">
		<div class="panel-content">
			<div class="panel-banner">
				<div class="banner-slides"></div>
				<ul class="banner-dots"></ul>
			</div>
			<div id="panel-menu" class="panel-menu ri-scroll">
				<button class="tab" data-index="0" data-title="Novidades">Novidades</button>
				<button class="tab" data-index="1" data-title="Populares">Populares</button>
				<button class="tab" data-index="2" data-title="Ofertas">Ofertas</button>
				<button class="tab" data-index="3" data-title="Aluguel">Aluguel</button>
				<button class="tab" data-index="4" data-title="Equipamento">Equipamento</button>
				<button class="tab" data-index="5" data-title="Pergaminhos">Pergaminhos</button>
				<button class="tab" data-index="6" data-title="Consumíveis">Consumíveis</button>
				<button class="tab" data-index="7" data-title="Outros">Outros</button>
				<button class="tab" data-index="8" data-title="Da conta">Da conta</button>
			</div>
			<div id="panel-items" class="panel-items ri-scroll"></div>
			<div class="panel-pagination">
				<button class="go-first pagi-handler" data-index="1" title="Primeira página">&laquo;</button>
				<button class="go-prev pagi-handler" data-index="2" title="Página anterior">&lsaquo;</button>
				<span class="pagi-changepage">1</span><span>/</span><span class="pagi-countpage">1</span>
				<button class="go-next pagi-handler" data-index="3" title="Próxima página">&rsaquo;</button>
				<button class="go-last pagi-handler" data-index="4" title="Última página">&raquo;</button>
			</div>
			<div class="panel-footer">
				<input
					type="text"
					id="cashshop-search"
					class="cashshop-search ri-input"
					aria-label="Buscar item pelo nome"
					placeholder="Buscar item…"
				/>
				<button id="cashshop-search-btn" class="cashshop-search-btn ri-btn">Buscar</button>
			</div>
		</div>
		<div class="panel-cart">
			<div class="panel-cart-header">
				<div class="panel-cart-header-title">Carrinho</div>
				<div class="panel-cart-charging-view">
					<div id="cashpoint" class="view-cash-point"><span>0</span></div>
					<div class="panel-cart-cash-points">
						<button class="panel-cart-charge-btn ri-btn ri-btn--sec">Recarregar</button>
					</div>
				</div>
			</div>
			<div class="panel-cart-body">
				<div id="cart-list" class="cart-list ri-scroll">
					<ul class="items"></ul>
				</div>
			</div>
			<div class="panel-cart-footer">
				<table>
					<tr>
						<td class="txt">Pontos grátis</td>
						<td class="value free-point">0 C</td>
					</tr>
					<tr>
						<td class="txt"><label for="use-free-points">Usar pontos grátis</label></td>
						<td class="value">
							<input
								type="number"
								id="use-free-points"
								class="use-free-points"
								placeholder="0"
								value="0"
							/>C
						</td>
					</tr>
					<tr>
						<td class="txt">Pontos de Cash</td>
						<td class="value cashpoint_footer">0 C</td>
					</tr>
				</table>
				<div class="cart-footer-action">
					<div class="total-price">
						<span>0 C</span>
					</div>
					<button id="purchase-btn" class="ri-btn">Comprar</button>
				</div>
			</div>
		</div>
	</div>
	<div class="overlay"></div>
</div>
