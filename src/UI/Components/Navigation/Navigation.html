<!-- Fase 3 (01/09/2026): a janela de navegacao (NAVI) sai dos bitmaps
     (titlebar_left/mid/right, txtbox_l/m/r, navisearch_*, sys_close_*) e
     entra no design system. Ganchos que Navigation.js consulta, todos
     preservados: .titlebar (arrasto) / .close / .search-type / .search-input
     / .search-button / .services-toggle / .location-title / .map-display /
     .map-name / .mouse-info .mouse-coordinates / .target-info
     .target-coordinates / .search-results (criado em runtime). As tres
     tiras decorativas do campo de busca (search-left/middle/right, so
     moldura de bitmap) sairam — o input agora e uma pele so, receita
     .ri-input. -->
<div class="Navigation">
	<div class="titlebar">
		<span class="title">Navegação</span>
		<button type="button" class="close" title="Fechar">&times;</button>
	</div>
	<div class="content">
		<div class="search-container">
			<select class="search-type">
				<option value="ALL">ALL</option>
				<option value="NPC">NPC</option>
				<option value="MOB">MOB</option>
			</select>
			<input type="text" class="search-input" placeholder="Buscar…" />
			<button type="button" class="search-button" title="Buscar">Buscar</button>
		</div>
		<div class="map-container">
			<div class="services-toggle-container">
				<label class="services-checkbox"><input type="checkbox" class="services-toggle" /> Serviços</label>
			</div>
			<div class="location-title"></div>
			<div class="map-display">
				<!-- Map will be displayed here -->
			</div>
		</div>
	</div>
	<div class="footer">
		<div class="coordinates-bar">
			<div class="map-name"></div>
			<div class="mouse-info">
				<span class="mouse-label">Mouse:</span>
				<span class="mouse-coordinates"></span>
			</div>
			<div class="target-info">
				<span class="target-label">Alvo:</span>
				<span class="target-coordinates"></span>
			</div>
		</div>
	</div>
</div>
