<div id="GuildCompanion">
	<div class="win companion ri-window">
		<div class="titlebar ri-header">
			<span class="ri-title title">Guilda</span>
			<button class="base btn_x ri-close" title="Fechar">&times;</button>
		</div>
		<div class="body">
			<div class="msg">Entre numa guilda ou funde a sua!</div>
			<div class="btns">
				<button class="btn btn_create ri-btn" type="button">criar guilda</button>
				<button class="btn btn_close ri-btn ri-btn--sec" type="button">OK</button>
			</div>
		</div>
	</div>
	<div class="win namebox ri-window">
		<div class="titlebar ri-header">
			<span class="ri-title title name_title">Criar Guilda</span>
			<button class="base btn_x2 ri-close" title="Fechar">&times;</button>
		</div>
		<div class="body">
			<div class="label name_label">Nome da Guilda</div>
			<input type="text" class="guildname ri-input" maxlength="23" />
			<div class="btns">
				<button class="btn btn_ok ri-btn" type="button">OK</button>
				<button class="btn btn_cancel ri-btn ri-btn--sec" type="button">cancelar</button>
			</div>
		</div>
	</div>
</div>
