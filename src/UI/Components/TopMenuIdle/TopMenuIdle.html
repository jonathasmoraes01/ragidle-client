<div id="TopMenuIdle">
	<!-- ─── NIVEL 1 — TOPO ENXUTO: so os 4 essenciais de gameplay (pedido do
	     dono, gauntlet item 2, 19/08/2026; eram 5 ate o item 5 de 20/08/2026
	     fundir Inventario+Equipamento num icone so). SEMPRE visivel, nunca
	     some -- e o que sobra na tela quando o menu retratil esta fechado (ver
	     TopMenuIdle.js/.css pra o que acontece nesse estado). O botao de
	     abrir/fechar o nivel 2 mora no FIM desta fileira, de proposito: ele
	     tambem nunca some, senao o jogador se tranca fora do resto. -->
	<div class="tm-top">
		<button type="button" class="tm-item" data-action="status" title="Personagem">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:personagem--></span>
			<span class="tm-label">Personagem</span>
		</button>

		<!-- Mochila (gauntlet item 5, 20/08/2026): UM icone so. Antes existiam
		     dois aqui, "Inventario" e "Equipamento", e a prova no jogo rodando
		     mediu os dois abrindo a MESMA janela unificada (MochilaIdle) --
		     duplicata visivel pro jogador, sem nenhum destino proprio atras
		     dela. O que ficou e o do INVENTARIO (arte ro_menu_icon/item_1, o
		     bau): ele representa "tudo o que eu carrego", que e o superconjunto
		     -- o peitoral do "equipamento" so falava da metade vestida. O
		     ROTULO virou "Mochila" pra casar com o nome da janela que abre (o
		     cabecalho direito dela diz "Mochila", MochilaIdle.html:14).
		     O "data-action" continua "inventory" de proposito: e a chave que o
		     switch de TopMenuIdle.js e o alvo do gate
		     (rag-idle-master/scripts/prova-clique-nao-vaza.ts) ja usam, e
		     renomear so trocaria o nome do mesmo destino. -->
		<button type="button" class="tm-item" data-action="inventory" title="Mochila">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:inventario--></span>
			<span class="tm-label">Mochila</span>
		</button>

		<button type="button" class="tm-item" data-action="skills" title="Skills">
			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:skills-->
				<!-- Ponto de "ponto de skill disponivel" — mesma fonte de dado que
				     DockIdle.js:syncSkillDot() (SkillList.getUI() .skpoints_count),
				     ligado/desligado por TopMenuIdle.js. -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Skills</span>
		</button>

		<!-- Caca (huntmap): duplicacao DECLARADA com o botao sob o minimapa
		     (#HuntButtonIdle, so aparece em cidade) -- pedido do dono, os dois
		     abrem a MESMA janela Mapa de Caca (HuntMap.toggle()). -->
		<button type="button" class="tm-item" data-action="huntmap" title="Mapa de Caça">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:caca--></span>
			<span class="tm-label">Caça</span>
		</button>

		<!-- Correio (gauntlet item 3, 20/08/2026): a caixa do SISTEMA
		     (rag-idle-master/servidor/caixa.ts, D-366) -- recompensa de
		     conquista e de missao chegam por aqui. Mora no NIVEL 1, e nao no 2,
		     por causa do INDICADOR: o nivel 2 pode ser fechado pelo jogador, e
		     um aviso de "voce tem mensagem" que some quando ele recolhe o menu
		     nao e um aviso. Esta e a unica razao -- pelo criterio de "uso a
		     toda hora" ele seria secundario. Mover pro nivel 2 e mover UM
		     bloco de HTML, se o dono preferir.
		     A fileira e "display:flex" com "justify-content:flex-end" (ver
		     TopMenuIdle.css): somar um item ALARGA o grupo pela esquerda e a
		     alca continua colada no minimapa -- o alinhamento que o item 5
		     consertou nao reabre. -->
		<button type="button" class="tm-item" data-action="correio" title="Correio">
			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:correio-->
				<!-- Ponto de "ha mensagem por ler" — receita ".ri-dot" do design
				     system, a MESMA que o ponto de skill acima usa. A fonte do
				     dado e CorreioIdle.temNaoLidas(), que conta o "Isread" da
				     lista do servidor e, enquanto ela nao chegou, cai no proprio
				     ZC_RODEX_ICON. -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Correio</span>
		</button>

		<!-- Abre/fecha o NIVEL 2 (menu retratil, ver ".tm-secondary" abaixo).
		     Fica FORA da grade retratil de proposito -- nunca some, e o unico
		     jeito de voltar quando o menu esta fechado. Direcao da seta muda
		     por rotacao em CSS, estado persiste via Preferences (mesma chave
		     "TopMenuIdle" de antes -- o SIGNIFICADO do booleano mudou de
		     "constelacao inteira recolhida" pra "menu retratil fechado", mas o
		     formato dos dados e identico, entao a preferencia salva de sessoes
		     anteriores continua lendo certo). -->
		<button type="button" class="tm-toggle" title="Fechar menu" aria-label="Fechar menu" aria-expanded="true" aria-controls="tm-secondary">
			<span class="tm-toggle-wrap ri-disc"><!--RI_ICONE:seta--></span>
		</button>
	</div>

	<!-- ─── NIVEL 2 — MENU RETRATIL: secundarios (pedido do dono). Abre/fecha
	     pelo ".tm-toggle" acima. FECHADO = "minimizar a UI": este bloco
	     inteiro (12 itens: Config/Guilda/Grupo/Menu/Admin + os 7 "em breve")
	     some da tela e para de aceitar clique -- e SO ele, o nivel 1 acima
	     continua de pe (ver TopMenuIdle.css ".tm-secondary.is-collapsed").
	     Cada item chama o MESMO metodo publico que ja abre a janela em outro
	     lugar do fork (ver cabecalho de TopMenuIdle.js pra fiacao exata). ── -->
	<div class="tm-secondary" id="tm-secondary">
		<button type="button" class="tm-item" data-action="guild" title="Guilda">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:guilda--></span>
			<span class="tm-label">Guilda</span>
		</button>

		<button type="button" class="tm-item" data-action="group" title="Grupo">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:grupo--></span>
			<span class="tm-label">Grupo</span>
		</button>

		<button type="button" class="tm-item" data-action="config" title="Config">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:config--></span>
			<span class="tm-label">Config</span>
		</button>

		<!-- Menu (ESC): mesma funcao que a tecla ESC nativa ja dispara (ver
		     TopMenuIdle.js). -->
		<button type="button" class="tm-item" data-action="menu" title="Menu">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:menu--></span>
			<span class="tm-label">Menu</span>
		</button>

		<!-- Admin: so aparece pra conta dona (isOwnerAccount() em
		     TopMenuIdle.js, mesmo criterio de AdminPanel.js:65) -- escondido
		     via display:none pelo JS pra qualquer outra conta. -->
		<button type="button" class="tm-item tm-item-admin" data-action="admin" title="Admin">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:admin--></span>
			<span class="tm-label">Admin</span>
		</button>

		<!-- ─── Em breve: a funcao NAO existe no jogo hoje (ver cabecalho de
		     TopMenuIdle.js). Visual honesto - DS pede DESSATURAR (grayscale),
		     nunca cinza chapado nem ornamento proprio - nenhum pacote sai,
		     nenhuma janela falsa abre. ──────────────────────────────────── -->

		<button type="button" class="tm-item tm-item--em-breve" data-action="loja" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:loja--></span>
			<span class="tm-label">Loja</span>
		</button>

		<button type="button" class="tm-item tm-item--em-breve" data-action="roshop" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:roshop--></span>
			<span class="tm-label">RO Shop</span>
		</button>

		<button type="button" class="tm-item tm-item--em-breve" data-action="troca" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:troca--></span>
			<span class="tm-label">Troca</span>
		</button>

		<button type="button" class="tm-item tm-item--em-breve" data-action="leilao" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:leilao--></span>
			<span class="tm-label">Leilão</span>
		</button>

		<button type="button" class="tm-item tm-item--em-breve" data-action="recompensas" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:recompensas--></span>
			<span class="tm-label">Recompensas</span>
		</button>

		<button type="button" class="tm-item tm-item--em-breve" data-action="eventos" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:eventos--></span>
			<span class="tm-label">Eventos</span>
		</button>

		<button type="button" class="tm-item tm-item--em-breve" data-action="passe" data-em-breve="1" title="Em breve">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:passe--></span>
			<span class="tm-label">Passe</span>
		</button>

		<!-- Toast "Em breve" - elemento proprio do componente, nunca um pacote
		     nem janela; some sozinho (ver TopMenuIdle.js showToast()). Mora
		     DENTRO do nivel 2 de proposito: todo item que pode disparar o
		     toast vive aqui, entao escondendo o nivel 2 (opacity 0) o toast
		     some junto sem precisar de regra propria. -->
		<div class="tm-toast" aria-live="polite"></div>
	</div>
</div>
