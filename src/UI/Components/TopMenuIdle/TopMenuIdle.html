<div id="TopMenuIdle">
	<!-- ═══ PARTE 1 — CLUSTER SUPERIOR DIREITO: fileira unica de CINCO
	     essenciais (Personagem, Mochila, Skills, Caca, Correio) + a alca de
	     recolher no fim dela. Reorganizacao de 20/08/2026 (frente "menu em
	     duas partes", gabarito redesign/referencia-hud-origin.md secao 1: "o
	     superior e uma fileira, nao uma grade de tres linhas").
	     Ate esta rodada existia um NIVEL 2 logo abaixo desta fileira -- uma
	     grade de 6 colunas com 12 icones. Ela saiu inteira daqui e virou o
	     leque do canto inferior direito (".tm-menu" mais abaixo); nenhum
	     destino se perdeu, so mudou de casa (a tabela dos 17 esta em
	     redesign/progresso-hud.md e o mapeamento item a item esta no
	     cabecalho de TopMenuIdle.js). -->
	<div class="tm-top">
		<button type="button" class="tm-item" data-action="status" title="Personagem">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:personagem--></span>
			<span class="tm-label">Personagem</span>
		</button>

		<!-- Mochila: UM icone so desde 20/08/2026. O "data-action" continua
		     "inventory" de proposito: e a chave que o switch de
		     TopMenuIdle.js e o alvo do gate
		     (rag-idle-master/scripts/prova-clique-nao-vaza.ts) ja usam, e
		     renomear so trocaria o nome do mesmo destino. -->
		<button type="button" class="tm-item" data-action="inventory" title="Mochila">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:inventario--></span>
			<span class="tm-label">Mochila</span>
		</button>

		<button type="button" class="tm-item" data-action="skills" title="Skills">
			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:skills-->
				<!-- Ponto de "ponto de skill disponivel" — mesma fonte de dado que
				     DockIdle.js:syncSkillDot() (SkillList.getUI() .skpoints_count),
				     ligado/desligado por TopMenuIdle.js. -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Skills</span>
		</button>

		<!-- Caca (huntmap): duplicacao DECLARADA com o botao sob o minimapa
		     (#HuntButtonIdle, so aparece em cidade) -- pedido do dono, os dois
		     abrem a MESMA janela Mapa de Caca (HuntMap.toggle()). -->
		<button type="button" class="tm-item" data-action="huntmap" title="Mapa de Caça">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:caca--></span>
			<span class="tm-label">Caça</span>
		</button>

		<!-- RECOMPENSAS (06/09/2026, pedido do dono): TROCOU DE CASA com o
		     Missoes. Ate hoje ele era o ultimo item do leque e o Missoes era o
		     sexto do cluster; o dono pediu a troca. Os dois so mudaram de
		     lugar -- nenhuma janela, nenhum "data-action" e nenhum pacote
		     mudou, e a contagem das duas partes continua a mesma (8 no
		     cluster, 11 no leque).

		     Por que ele merece o cluster: e o unico produto PAGO do menu, e
		     um botao que se paga so existe se o jogador o encontrar. Numa
		     gaveta que vive FECHADA ele dependia de o jogador abrir a porta
		     por conta propria -- a mesma razao que ja tinha trazido o Correio
		     para ca (ver o bloco dele acima).

		     O "data-action" continua "passe", e a divergencia com o rotulo e
		     deliberada: ele nomeia o DOMINIO (o componente e PasseIdle, os
		     pacotes sao CZ/ZC_RAGIDLE_*_PASSE) e "Recompensas" e o nome que o
		     jogador ve. Alem disso e a chave que o switch de TopMenuIdle.js e
		     o gate prova-clique-nao-vaza.ts ja miram: renomear a cadeia
		     inteira seria churn nos dois repositorios para trocar uma palavra
		     de tela.

		     O DESTAQUE dourado (".tm-item--destaque") VEIO JUNTO, e continua
		     valendo aqui: a regra do CSS nunca foi escopada ao leque, e o
		     vocabulario (--border-gold/--glow-gold) e o da janela que ele
		     abre. O ICONE e ARTE REAL do cliente
		     (ro_menu_icon/achievement_1.bmp, o trofeu), pela regra 4.

		     ─── POR QUE ELE E O PRIMEIRO DA SEGUNDA FILEIRA, E NAO ONDE O
		     MISSOES ESTAVA ────────────────────────────────────────────────
		     Isto NAO e gosto: e a unica posicao que cabe. A grade tem colunas
		     "auto", entao a largura de cada coluna e a do ROTULO mais largo
		     dela, e "Recompensas" e o rotulo mais largo do cluster inteiro.
		     Em qualquer coluna que nao seja a do "Personagem" (o segundo mais
		     largo) ele SOMA largura ao cluster; embaixo dele, o "max" da
		     coluna quase nao muda.

		     Medido num arnes de leiaute (o cluster sozinho num Playwright, em
		     768x1024): 337px aqui, 359px no lugar onde o Missoes estava, 331px
		     antes da troca. A diferenca nao e estetica: com ele no lugar do
		     Missoes o `prove:hud-responsiva` REPROVOU em tablet-768x1024 com
		     "BasicInfoIdle x TopMenuIdle.tm-top (13x146px)" — o cluster montou
		     em cima do painel do personagem. Aqui ele passa.

		     QUEM REORDENAR ESTE CLUSTER RE-MEDE. A regra em uma linha: o
		     rotulo mais longo mora na mesma coluna do segundo mais longo. -->
		<button type="button" class="tm-item tm-item--destaque" data-action="passe" title="Recompensas">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:recompensas--></span>
			<span class="tm-label">Recompensas</span>
		</button>

		<!-- Correio: a caixa do SISTEMA (rag-idle-master/servidor/caixa.ts,
		     D-366). Mora no cluster de cima, e nao no leque, por causa do
		     INDICADOR: o leque vive FECHADO, e um aviso de "voce tem
		     mensagem" que so aparece depois de abrir uma gaveta nao e um
		     aviso. Quando o jogador recolhe o cluster pela alca, o ponto
		     migra para a propria alca (ver ".tm-toggle .ri-dot" abaixo e
		     syncToggleDot() em TopMenuIdle.js) -- e a unica forma de o
		     indicador nunca ter um estado onde ele some. -->
		<button type="button" class="tm-item" data-action="correio" title="Correio">
			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:correio-->
				<!-- Ponto de "ha mensagem por ler" — receita ".ri-dot" do design
				     system, a MESMA que o ponto de skill acima usa. A fonte do
				     dado e CorreioIdle.temNaoLidas(), que conta o "Isread" da
				     lista do servidor e, enquanto ela nao chegou, cai no proprio
				     ZC_RODEX_ICON. -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Correio</span>
		</button>

		<!-- IDLE (21/08/2026, pedido do dono): o antigo "Configuracoes" saiu do
		     leque e subiu para o cluster, com o nome que descreve o que ele abre.
		     A janela e a MESMA (IdleConfig) e o "data-action" continua "config"
		     DE PROPOSITO: e a chave que o portao prova-clique-nao-vaza.ts e os
		     roteiros de foto ja miram, e renomea-la trocaria o nome do mesmo
		     destino em varios arquivos sem ganho nenhum.
		
		     Por que ele merece o cluster e nao a gaveta: e o painel que se mexe
		     ENTRE uma sessao idle e outra (coleta, lista negra, pocao), nao um
		     destino ocasional como Loja ou Leilao. E o leque fica com 10 itens,
		     que e a divisao 5+5 que o dono desenhou. -->
		<button type="button" class="tm-item" data-action="config" title="Idle">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:config--></span>
			<span class="tm-label">Idle</span>
			<!-- D-939: no trilho do celular em pe o mockup do dono escreve
			     "Config." — "Idle" solto num trilho sem contexto nao se le.
			     Escondido por padrao (.tm-label--v), so a HUD vertical o mostra. -->
			<span class="tm-label tm-label--v" aria-hidden="true">Config.</span>
		</button>

		<!-- HUNT ANALYZER: a leitura da cacada em curso (exp/hora, abates/hora,
		     ranking de monstro, itens e taxa). Cluster e nao leque pelo mesmo
		     criterio que subiu o Idle: e painel que se consulta DURANTE a
		     sessao para decidir se o spot presta, nao um destino ocasional.
		     Fica ao lado do "Idle" de proposito -- os dois respondem a mesma
		     pergunta, um configura a caca e o outro mede o resultado.

		     Icone "grafico": ja existia em ri-icones.js e nao tinha consumidor.
		     Nenhum icone novo entrou por causa desta janela. -->
		<button type="button" class="tm-item" data-action="analyzer" title="Hunt Analyzer">
			<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:grafico--></span>
			<span class="tm-label">Análise</span>
		</button>

		<!-- VOTAR (D-1159, 07/09/2026, pedido do dono: "esse botao de votar
		     deve ficar na barra de cima ao lado do mini mapa com bastante
		     destaque quando tem voto disponivel").

		     ─── ELE MUDOU DE LUGAR NA TELA EM 08/09/2026, E NAO NO DOM ──────
		     Pedido do dono, olhando o cluster no jogo: *"mude o icone de Votar
		     de lugar, coloque ele ao lado do icone Caca, sobrando uma vaga
		     para icone abaixo"*. Agora, em tela larga, ele desenha na PRIMEIRA
		     fileira, coluna 5, colado no "Caca" — e a coluna 5 da segunda
		     fileira fica vazia, que e a vaga que o dono reservou.

		     A mudanca e de GRADE, nao de documento: ele continua sendo o nono
		     `<button>` daqui, e quem o move e uma regra de uma linha no
		     TopMenuIdle.css (`.tm-top[data-colunas="5"] .tm-item--voto`). Isso
		     e deliberado, e custou uma medicao para descobrir: reordenar o DOM
		     (por o botao entre "Caca" e "Recompensas") tira o "Recompensas" da
		     coluna do "Personagem" e o poe na do "Mochila" — e a regra de D-944
		     diz que o rotulo mais longo tem de morar na coluna do segundo mais
		     longo. Medido: com o DOM reordenado, o `prove:hud-responsiva`
		     REPROVA em tablet-768x1024 mesmo com quatro colunas
		     ("BasicInfoIdle x TopMenuIdle.tm-top 13x224px"), porque o cluster
		     engorda 13px. Com o DOM intacto, a queda para quatro colunas volta
		     a ser BYTE A BYTE o arranjo que ja passava.

		     ─── POR QUE ELE E O NONO E ULTIMO NO DOM, E POR QUE ISSO NAO
		     ENGORDA O CLUSTER ──────────────────────────────────────────────
		     A regra medida em D-944 diz que a grade tem colunas "auto": a
		     largura de cada coluna e a do ROTULO mais largo dela. Um nono item
		     com a conta antiga de colunas (metade dos visiveis, arredondada
		     para cima) daria CINCO colunas, e a quinta nasceria com o
		     "Recompensas" sozinho — o rotulo mais largo do cluster inteiro
		     virando a coluna mais larga, ~84px a mais.

		     Com QUATRO colunas (o teto abaixo de 900px de largura, ver
		     distribuirFileiras() em TopMenuIdle.js) ele cai na TERCEIRA
		     fileira, na coluna 1, embaixo de "Personagem" e "Recompensas".
		     "Votar" e mais curto que os dois, entao o `max` da coluna nao muda
		     e a largura do cluster fica IDENTICA a de antes deste botao. O que
		     cresce e a altura, para baixo, onde ha espaco — e o rastreador de
		     missoes ja se ajusta sozinho por `--tm-topo` (D-930).

		     ACIMA de 900px o teto e CINCO, e ai ele sobe para a primeira
		     fileira (a regra de grade citada acima). A quinta coluna que nasce
		     e a do "Votar", um dos rotulos mais curtos — nao a do
		     "Recompensas", que era o risco medido em D-1159. O corte em 900px
		     tambem foi medido: com cinco colunas em TODA tela o cluster vai de
		     333px para 403px e o `prove:hud-responsiva` reprova em
		     tablet-768x1024 ("BasicInfoIdle x TopMenuIdle.tm-top 57x146px").

		     ─── O DESTAQUE ──────────────────────────────────────────────────
		     ".is-voto-livre" (aro dourado + pulso) entra e sai por JS, lendo
		     `VotoIdle.temVotoDisponivel()` — que le o campo `liberados` que o
		     SERVIDOR calculou. O botao e a janela contam a mesma historia
		     porque leem o mesmo numero; recalcular aqui seria a segunda conta
		     da mesma regra. -->
		<button type="button" class="tm-item tm-item--voto" data-action="voto" title="Votar e ganhar Vote Cash">
			<span class="tm-icon-wrap ri-disc">
				<!--RI_ICONE:voto-->
				<!-- Ponto de "ha voto disponivel" — a MESMA receita ".ri-dot" do
				     Correio e do Skills, para o aviso sobreviver ao cluster
				     recolhido (ele migra para a alca, ver syncToggleDot()). -->
				<span class="ri-dot" style="display: none"></span>
			</span>
			<span class="tm-label">Votar</span>
		</button>

		<!-- Alca de recolher o CLUSTER (os 5 acima). Fica FORA do que ela
		     esconde, de proposito: nunca some, senao o jogador se tranca fora
		     dos essenciais. Recolhido, e o unico pixel que sobra deste canto.
		     O ".ri-dot" aqui e o do Correio/Skills EMPRESTADO: com o cluster
		     recolhido, o aviso passa a morar na alca (ver syncToggleDot()). -->
		<button type="button" class="tm-toggle" title="Recolher menu" aria-label="Recolher menu" aria-expanded="true" aria-controls="tm-top">
			<span class="tm-toggle-wrap ri-disc">
				<!--RI_ICONE:seta-->
				<span class="ri-dot" style="display: none"></span>
			</span>
		</button>
	</div>

	<!-- ═══ PARTE 2 — CANTO INFERIOR DIREITO: uma PORTA, nao um segundo
	     cluster (gabarito secao 2: "fechado, existe so o botao"). Um botao
	     "Menu"; clicando, o leque abre EM PE a partir dele; clicando de novo,
	     o leque some inteiro do DOM renderizado (display:none — ver
	     TopMenuIdle.js:aplicarEstadoDoLeque()) e sobra so o botao.

	     RODADA 2 (20/08/2026) — a forma MUDOU por pedido do dono, e a secao 3
	     do gabarito foi reescrita com ela: eram onze discos numa fileira
	     horizontal SEM rotulo, e sobre o calcamento claro de Prontera aquilo
	     lia como ruido. Agora sao DUAS COLUNAS em pe, com a carga dividida ao
	     meio, uma LINHA DOURADA vertical entre elas e um ornamento premium no
	     topo dessa linha. Em pe sobra largura, entao o ROTULO VOLTOU,
	     permanente e igual ao do cluster de cima — que era o defeito de
	     fundo.

	     ORDEM: funcionais primeiro (Guilda, Amigos, Grupo, Admin, Codex,
	     Missoes) e "em breve" por ultimo, nunca misturado. Em 06/09/2026 o
	     Recompensas SAIU daqui (subiu para o cluster) e o Missoes ENTROU no
	     lugar dele, no fim do bloco funcional -- a troca que o dono pediu; a
	     contagem do leque nao mudou (11 botoes, 10 visiveis). A leitura e a natural do
	     portugues: desce a coluna da ESQUERDA e depois desce a da DIREITA.
	     Quem POE cada item na sua coluna e o JS (distribuirColunas()), nao
	     este HTML: o item de Admin so existe para a conta dona, e com ele
	     escondido sobram 10 — que e o "5 de um lado e 5 do outro" do pedido.
	     O que este arquivo declara e a ORDEM canonica (coluna A e depois
	     coluna B, de cima para baixo); o corte entre as duas e recalculado a
	     cada aparicao. -->
	<div class="tm-menu">
		<div class="tm-fan" id="tm-fan" role="group" aria-label="Mais opções">
			<!-- O VEU (pedido do dono, 20/08/2026): "um gradiente preto saindo
			     da barra e indo ate as bordas com um efeito bem leve e suave de
			     escurecimento". E o CHAO do leque: sem ele os discos dependem do
			     que a cena tem atras, e o calcamento branco de Prontera briga
			     com eles.
			     Vem PRIMEIRO no HTML de proposito: assim ele pinta por baixo de
			     todos os discos sem precisar de z-index negativo (que sairia do
			     contexto de empilhamento do componente).
			     E ele NAO amplia area clicavel nenhuma: e "position:absolute"
			     (fora do fluxo da grade, entao nao mede nada) e
			     "pointer-events:none" (herdado do ".tm-fan" e repetido no CSS
			     por seguranca). Camada invisivel que cobre o mundo e a familia
			     de defeito que o gate de clique existe pra pegar -- ver o
			     cabecalho do CSS. -->
			<div class="tm-veu" aria-hidden="true"></div>

			<div class="tm-col tm-col--a">
				<!-- "Configuracoes" (20/08/2026) = a FUSAO dos dois icones que
				     existiam ate ontem, "Config" e "Menu". Os dois eram gaveta de
				     ajuste e o jogador tinha de adivinhar qual era qual. O clique
				     abre a "Configuracao idle" (IdleConfig), que e a janela que o
				     rotulo nomeia e a que se usa jogando. A janela de sistema do
				     ESC (audio/video/atalho/trocar personagem/fechar jogo)
				     continua na tecla ESC, nativa e intocada -- esta e a perda
				     declarada da fusao, registrada na resposta como pendencia
				     [DONO]. -->
				<button type="button" class="tm-item" data-action="guild" title="Guilda">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:guilda--></span>
					<span class="tm-label">Guilda</span>
				</button>

				<!-- Ate 01/09/2026 este botao desenhava o MESMO icone do Grupo
				     logo abaixo — dois rotulos, uma figura. A chave `amigos`
				     nasceu na onda de icones ([DONO-5]): o par DESARMADO e
				     Amigos, o armado e Grupo. -->
				<button type="button" class="tm-item" data-action="group" title="Amigos">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:amigos--></span>
					<span class="tm-label">Amigos</span>
				</button>
				<button type="button" class="tm-item" data-action="lfg" title="Grupo">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:grupo--></span>
					<span class="tm-label">Grupo</span>
				</button>

				<!-- Admin: so aparece pra conta dona (isOwnerAccount() em
				     TopMenuIdle.js, mesmo criterio de AdminPanel.js:65) -- escondido
				     via display:none pelo JS pra qualquer outra conta. Escondido ele
				     nao abre buraco nenhum: distribuirColunas() conta so os
				     VISIVEIS pra achar o meio, e por isso as duas colunas continuam
				     empatadas em 5 e 5 pra quem nao e o dono. -->
				<button type="button" class="tm-item tm-item-admin" data-action="admin" title="Admin">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:admin--></span>
					<span class="tm-label">Admin</span>
				</button>

				<!-- CODEX (29/08/2026, D-851): o bestiario que vira ponto de
				     atributo. Matar N de uma especie cumpre uma missao, e cada
				     missao cumprida vale 1 ponto para gastar num dos sete eixos.
				
				     LEQUE e nao cluster, pelo criterio que ja moveu o Idle e o
				     Analyzer para cima: o cluster e para o que se consulta DURANTE
				     a cacada, e o Codex e destino OCASIONAL — abre-se quando um
				     ponto novo entrou, gasta-se, e fecha. Ele fica com os
				     funcionais, ANTES do bloco "em breve", que e a ordem canonica
				     declarada no cabecalho deste arquivo (quem POE cada item na
				     sua coluna e distribuirColunas(), no JS).
				
				     O ICONE e Lucide "BookOpen" — "codex" e literalmente o livro,
				     e o cliente oficial nao tem candidato em ro_menu_icon para uma
				     mecanica que e NOSSA (ver a nota da chave em ri-icones.js,
				     que declara o parentesco com o icone de skills). -->
				<button type="button" class="tm-item" data-action="codex" title="Codex">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:codex--></span>
					<!-- Ponto de "ha objetivo esperando voce" — a MESMA receita
					     ".ri-dot" do Correio e das Skills (D-1232). O design system
					     tem UM indicador de notificacao, e este e ele. -->
					<span class="ri-dot" style="display: none"></span>
					<span class="tm-label">Codex</span>
				</button>
				<!-- RAGIDLE (D-1162): a presença mensal — a janela que abre sozinha
				     1x por dia e à meia-noite; aqui fica o caminho manual. -->
				<button type="button" class="tm-item" data-action="presenca" title="Presença">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:presenca--></span>
					<span class="tm-label">Presença</span>
				</button>
				<!-- RAGIDLE (D-1164): Indique & Ganhe — o link de convite e os ganhos. -->
				<button type="button" class="tm-item" data-action="indicacao" title="Indique &amp; Ganhe">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:indicacao--></span>
					<span class="tm-label">Indique</span>
				</button>

				<!-- MISSOES (D-551) -- 06/09/2026: DESCEU do cluster para o leque, em
				     troca com o Recompensas (pedido do dono). Ele subiu para o
				     cluster em 24/08/2026 com o argumento de que a primeira missao
				     principal e o momento-chave do early game; o que o argumento nao
				     considerava e que quem acompanha a missao de toda hora e o
				     RASTREADOR (MissoesTrackerIdle, D-601), sempre visivel abaixo do
				     painel do personagem. A JANELA e destino ocasional -- abre-se
				     para escolher a proxima missao e fecha -- que e exatamente o
				     criterio do leque.

				     Ele fica com os FUNCIONAIS, ANTES do bloco "em breve": e a ordem
				     canonica declarada no cabecalho deste arquivo (quem POE cada
				     item na sua coluna e distribuirColunas(), no JS -- com 10
				     visiveis ele cai como ultimo item da coluna da esquerda).

				     A janela nao mudou: o mesmo MissoesIdle.toggle(), que PEDE o
				     estado ao servidor (0x0fec) ao abrir. -->
				<button type="button" class="tm-item" data-action="missoes" title="Missões">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:missoes--></span>
					<span class="tm-label">Missões</span>
				</button>

				<!-- ─── Em breve: a funcao NAO existe no jogo hoje (ver cabecalho de
				     TopMenuIdle.js). Visual honesto - o DS pede DESSATURAR, e na
				     rodada 2 a dessaturacao encolheu para o MIOLO: o disco e o aro
				     dourado ficam em opacidade cheia (senao o botao inteiro
				     desaparecia no calcamento branco de Prontera) e so o glifo fica
				     cinza. Nenhum pacote sai, nenhuma janela falsa abre.
				     NAO usam o atributo "disabled" nativo de proposito: um botao
				     "disabled" nao dispara clique nenhum e o jogador ficaria sem
				     resposta ao tocar nele. Aqui o clique cai no toast "Em breve"
				     (onClickAction() sai antes do switch) e o estado e declarado
				     em tres lugares: o cinza do glifo, o "title" e o "aria-disabled"
				     (que e o que o leitor de tela anuncia). O rotulo continua
				     dizendo o NOME da funcao, nunca "Em breve". ─────────────── -->

				<button type="button" class="tm-item tm-item--em-breve" data-action="loja" data-em-breve="1" title="Loja — em breve" aria-disabled="true">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:loja--></span>
					<span class="tm-label">Loja</span>
				</button>

				<!-- RO SHOP LIGADO (I5, 31/08/2026 — pedido do dono: "mudar o
				     botao atual da loja de cash para o RO Shop").

				     Ele ja existia aqui como "em breve", desabilitado, enquanto
				     a loja de cash era um ICONE BMP SOLTO flutuando ao lado do
				     minimapa (CashShopIcon, 43x45, sem rotulo). O pedido junta
				     as duas pontas: o item rotulado do menu passa a ser a porta
				     da loja, e o icone solto se aposenta.

				     A janela e a MESMA de sempre — a `CashShop` nativa do
				     roBrowser, que o icone solto ja abria. Nao ha janela nova. -->
				<button type="button" class="tm-item" data-action="roshop" title="RO Shop">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:roshop--></span>
					<span class="tm-label">RO Shop</span>
				</button>
			</div>

			<!-- O DELIMITADOR entre as duas colunas (pedido do dono: "separando
			     eles deve ter uma linha dourada igual a que separa as skills, e
			     no topo dessa linha deve ter um detalhe com visual premium").
			     E decoracao pura: "aria-hidden" pro leitor de tela nao anunciar
			     um elemento sem nome no meio da lista de botoes. A receita da
			     linha vem de DockIdle.css (".dk-delimitador", a mesma que
			     separa os grupos da barra de habilidades) e o ornamento e a
			     mesma familia das barras de titulo das nossas janelas: o par de
			     asas douradas (--ri-asa) espelhado, com o losango do
			     ".ri-divisor" no meio. Ver o CSS pra conta de cada peca. -->
			<div class="tm-sep" aria-hidden="true">
				<span class="tm-sep-ornamento"><span class="tm-sep-joia"></span></span>
				<span class="tm-sep-linha"></span>
			</div>

			<div class="tm-col tm-col--b">
				<button type="button" class="tm-item tm-item--em-breve" data-action="troca" data-em-breve="1" title="Troca — em breve" aria-disabled="true">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:troca--></span>
					<span class="tm-label">Troca</span>
				</button>

				<button type="button" class="tm-item tm-item--em-breve" data-action="leilao" data-em-breve="1" title="Leilão — em breve" aria-disabled="true">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:leilao--></span>
					<span class="tm-label">Leilão</span>
				</button>

				<button type="button" class="tm-item tm-item--em-breve" data-action="eventos" data-em-breve="1" title="Eventos — em breve" aria-disabled="true">
					<span class="tm-icon-wrap ri-disc"><!--RI_ICONE:eventos--></span>
					<span class="tm-label">Eventos</span>
				</button>
			</div>

			<!-- Toast "Em breve": mora DENTRO do leque desde a rodada 2, e nao
			     mais solto no canto. Os sete "em breve" so existem aqui dentro,
			     entao o toast so pode aparecer com o leque aberto -- e ancorado
			     no leque ele nasce logo acima do ornamento, no meio do campo de
			     visao de quem acabou de clicar, em vez de encostado na quina da
			     tela por baixo da segunda coluna. Ele nunca e pacote nem janela
			     e some sozinho (ver showToast() em TopMenuIdle.js). -->
			<div class="tm-toast" aria-live="polite"></div>

			<!-- INSTALAR O APP (08/09/2026, pedido do dono).

			     Ele NASCE ESCONDIDO e so aparece quando `decidirOferta()`
			     (UI/ofertaDeInstalacao.js, D-945) diz que ha o que fazer:
			     nunca dentro do PWA ja instalado, e nunca como botao morto.
			     A decisao NAO e reescrita aqui — este arquivo so desenha, do
			     mesmo jeito que a tela de entrada e a aba de Config ja fazem.

			     Por que uma LINHA larga e nao mais um disco: ela nao e um
			     destino do jogo, e misturar "instalar o app" entre Mochila e
			     Skills daria a ela o mesmo peso de uma janela. Ela mora no pe
			     da folha, larga, com o rotulo escrito por extenso.

			     Ela e do CELULAR: o CSS so a mostra sob `.ri-vertical`. No
			     desktop a porta continua sendo a aba de Config. -->
			<button type="button" class="tm-instalar" data-action="instalar" hidden>
				<span class="tm-instalar-rotulo">Instalar app</span>
				<span class="tm-instalar-dica"></span>
			</button>
		</div>

		<!-- O botao Menu. Disco maior que os do leque (52 contra 42): ele e a
		     porta, nao um item. Rotulo SEMPRE visivel — e agora os do leque
		     tambem tem o seu, permanente (ver ".tm-fan .tm-label" no CSS). -->
		<button type="button" class="tm-fab" title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="tm-fan">
			<span class="tm-fab-wrap ri-disc"><!--RI_ICONE:menu--></span>
			<span class="tm-label">Menu</span>
		</button>
	</div>
</div>
