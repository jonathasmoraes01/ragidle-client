<div id="MiniMapV2" class="MiniMapUI">
	<div class="mm-window ri-window">
		<div class="mm-header">
			<span class="mm-mapname">—</span>
			<!-- MINIMIZAR O MAPA (15/10/2026, pedido do dono, so na HUD mobile
			     premium): o toque na pilula do nome deixa so ela na tela, e
			     outro toque devolve o mapa. Fora da premium o botao nao aparece
			     (MiniMapV2.css) e o minimapa continua sem controle nenhum. -->
			<button
				type="button"
				class="mm-recolher"
				title="Minimizar o mapa"
				aria-label="Minimizar o mapa"
				aria-expanded="true"
			>
				<span class="mm-recolher-glifo" aria-hidden="true"></span>
			</button>
		</div>
		<!-- Pedido do dono (01/09/2026): o minimapa NAO e clicavel — mostra o
		     mapa atual e pronto, sem botao nenhum. Sairam os 5 ui-button
		     (object/viewon/mini e o zoom -/+); MiniMapCommon.js ganhou guarda
		     de nulo para continuar servindo as versoes antigas que ainda os
		     tem. O zoom fica no valor salvo da preferencia. -->
		<div class="mm-body">
			<div class="mm-canvas-frame">
				<canvas width="128" height="128"></canvas>
			</div>
		</div>
		<div class="mm-footer">
			<div class="coordinates">
				<span class="coord x">0</span><span class="mm-coord-sep">,</span><span class="coord y">0</span>
			</div>
		</div>
	</div>
</div>
