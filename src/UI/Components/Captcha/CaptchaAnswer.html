<!-- Fase 3 (01/09/2026): a janela de resposta do captcha sai dos bitmaps
     (titlebar_mid, sys_base_*, btn_ok*) e entra no design system. Ganchos
     que CaptchaAnswer.js consulta, todos preservados: .titlebar (arrasto) /
     .answer_input / .ok / .preview_box / .retry_count / .timer_text /
     .timer_bar_fill / .error_text. O rotulo do botao, antes pintado no
     bitmap btn_ok.bmp, agora e texto. -->
<div id="CaptchaAnswer">
	<div class="titlebar">
		<span class="base" aria-hidden="true"></span>
	</div>
	<div class="container">
		<div class="information">
			<div class="message">
				<ui-text msg="2883">Hello, illegal software is being monitored.</ui-text><br />
				<ui-text msg="2884">Please enter the text below within the specified time.</ui-text><br />
				<ui-text msg="2885">If you enter the text wrong three times, you will get banned</ui-text><br />
				<span class="error_text"></span>
			</div>
			<div class="timer_bar_bg">
				<div class="timer_bar_fill"></div>
			</div>

			<div class="status">
				<span class="retry_count">Remaining chance: 3</span>
				<span class="timer_text">00:59</span>
			</div>
		</div>
		<div class="preview_box"></div>
		<div class="controls">
			<input type="text" class="answer_input" placeholder="Resposta do captcha" />
			<button type="button" class="btn ok">Confirmar</button>
		</div>
	</div>
</div>
