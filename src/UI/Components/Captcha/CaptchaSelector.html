<!-- Fase 3 (01/09/2026): o seletor de alvos do captcha sai dos bitmaps
     (titlebar_mid, sys_base_*, sys_close_*, btn_q_active*, btnbar_mid2,
     btn_ok*) e entra no design system. Ganchos que CaptchaSelector.js
     consulta, todos preservados: .titlebar (arrasto) / .close /
     input[name="target_type"] / .range_val / .btn_active / .player_list li
     (linhas nascem no JS, com um <ui-button class="base remove"> dinamico
     que ficou como estava — bitmap isolado, nao quebra a pele nova) / .ok /
     .close-character / .character_info .character-name/.character-job. -->
<div id="CaptchaSelector">
	<div class="titlebar">
		<span class="base" aria-hidden="true"></span>
		<button type="button" class="base close" title="Fechar">&times;</button>
	</div>
	<div class="container">
		<div class="options">
			<input id="target_type_character" type="radio" name="target_type" value="character" checked />
			<label for="target_type_character"><ui-text msg="2887"></ui-text></label>
			<input id="target_type_range" type="radio" name="target_type" value="range" />
			<label for="target_type_range"><ui-text msg="2888"></ui-text></label>
			<input type="number" class="range_val" value="1" min="1" max="9" />
			<button type="button" class="btn btn_active">Ativar</button>
		</div>
		<ul class="player_list">
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
			<li class="player"></li>
		</ul>
		<div class="footer">
			<button type="button" class="btn ok">Confirmar</button>
		</div>
	</div>
	<div class="character_info">
		<button type="button" class="base close-character" title="Fechar">&times;</button>
		<span class="character-name"></span><br />
		<span class="character-job"></span>
	</div>
</div>
