<!-- Fase 3 (01/09/2026): a janela de upload do captcha sai dos bitmaps
     (titlebar_mid, sys_base_*, sys_close_*, txtbox_btn_*, btn_ok*) e entra
     no design system. Ganchos que CaptchaUpload.js consulta, todos
     preservados: .titlebar (arrasto) / .close / .captcha_file_text /
     .btn_browse / .captcha_file_input / .preview_box / .answer_input / .ok. -->
<div id="CaptchaUpload">
	<div class="titlebar">
		<span class="base" aria-hidden="true"></span>
		<button type="button" class="base close" title="Fechar">&times;</button>
	</div>
	<div class="container">
		<div class="custom_file_input">
			<input type="text" class="captcha_file_text" readonly placeholder="Nenhum arquivo selecionado" />
			<button type="button" class="btn_browse" title="Escolher arquivo">…</button>
			<input type="file" class="captcha_file_input" accept="image/bmp" style="display: none" />
		</div>
		<div class="preview_box"></div>
		<div class="controls">
			<input type="text" class="answer_input" placeholder="Resposta do captcha" />
			<button type="button" class="btn ok">Confirmar</button>
		</div>
	</div>
</div>
