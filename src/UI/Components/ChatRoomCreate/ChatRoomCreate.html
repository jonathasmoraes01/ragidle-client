<!-- Fase 4 (01/09/2026): "Criar Sala" no design system oficial. Ganchos que
     ChatRoomCreate.js consulta, todos preservados: .titlebar (alca de
     arrasto) / .close / .cancel / .ok / .setup (o <form>) / .title (o input
     do titulo, usado para foco) / input[name=title|password] /
     select[name=limit|type] / input[name=public]. Chrome de bitmap
     (titlebar_mid.bmp, sys_close_*.bmp, btn_ok/btn_cancel*.bmp) saiu inteiro;
     o miolo de tabela virou formulario com tokens. -->
<div id="ChatRoomCreate">
	<div class="crc-janela ri-window">
		<div class="titlebar ri-header">
			<span class="ri-title" data-text="125">Criar Sala</span>
			<button type="button" class="close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="panel crc-corpo">
			<form class="setup crc-form">
				<label class="crc-campo crc-campo--titulo">
					<span class="crc-rotulo">Título</span>
					<input class="title ri-input" type="text" name="title" value="" maxlength="32" />
				</label>

				<div class="crc-linha">
					<label class="crc-campo">
						<span class="crc-rotulo">Limite</span>
						<select name="limit" class="limit ri-input">
							<option value="20">20</option>
							<option value="12">12</option>
							<option value="8">8</option>
							<option value="4">4</option>
							<option value="2">2</option>
						</select>
					</label>
					<label class="crc-campo crc-campo--tipo">
						<span class="crc-rotulo">Tipo</span>
						<select name="type" class="type ri-input">
							<option value="1" data-text="130">Sala de bate-papo</option>
						</select>
					</label>
				</div>

				<div class="crc-linha crc-restricao">
					<span class="crc-rotulo">Restrição</span>
					<label class="crc-radio">
						<input type="radio" name="public" value="1" checked="checked" />
						<span data-text="201">Púb.</span>
					</label>
					<label class="crc-radio">
						<input type="radio" name="public" value="0" />
						<span data-text="200">Priv.</span>
					</label>
					<label class="crc-campo crc-campo--senha">
						<span class="crc-rotulo">Senha</span>
						<!-- type=text mascarado por CSS, NUNCA type=password; e o name foge de
						     "password" de proposito -- os dois sao sinais que fazem o Chrome
						     oferecer a credencial salva da CONTA aqui (ver GUIComponent.js). -->
						<input
							class="password ri-input ri-senha-mascarada"
							type="text"
							name="senha-da-sala"
							value=""
							maxlength="16"
							autocomplete="off"
							spellcheck="false"
							autocapitalize="off"
						/>
					</label>
				</div>
			</form>
		</div>

		<div class="footer crc-rodape">
			<button type="button" class="btn cancel ri-btn ri-btn--sec">Cancelar</button>
			<button type="button" class="btn ok ri-btn">Criar</button>
		</div>
	</div>
</div>
