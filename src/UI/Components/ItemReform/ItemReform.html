<!-- Fase 3 (01/09/2026): moldura saiu do bitmap unico (itemreform/bg_reform.bmp)
     e virou .ri-window; slots de item (result/base/material) ganharam .ri-tile
     (nao tinham moldura propria nenhuma antes). -->
<div id="ItemReform">
	<div class="container ri-window">
		<div class="titlebar ri-header">
			<div class="base"></div>
			<span class="item_text ri-title"></span>
			<button type="button" class="close ri-close" title="Fechar">&times;</button>
		</div>
		<div class="overlay"></div>
		<div class="panel">
			<div class="left_panel">
				<div class="result_info_container">
					<div class="result_item ri-tile"></div>
					<div class="base_item ri-tile"></div>
					<div class="result_item_text"></div>
					<div class="information_details"><ui-text msg="3854"></ui-text></div>
					<div class="material_list"></div>
				</div>
			</div>
			<div class="right_panel">
				<div class="available_material_list ri-scroll"></div>
			</div>
		</div>
		<div class="footer">
			<div class="some_notifs">
				<span class="info_msg"></span>
			</div>
			<button type="button" class="cancel ri-btn ri-btn--sec">Cancelar</button>
			<button type="button" class="reform_enabled ri-btn"><ui-text msg="3847"></ui-text></button>
			<button type="button" class="reform_disabled ri-btn is-disabled" disabled>
				<ui-text msg="3847"></ui-text>
			</button>
		</div>
	</div>
</div>
