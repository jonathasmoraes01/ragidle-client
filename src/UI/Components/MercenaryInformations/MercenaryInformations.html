<!-- Fase 3 (01/09/2026): a janela de Info do Mercenário saiu do bitmap de
     fundo (homuninfo_bg.bmp) e dos botões pintados (btn_skill/btn_del/
     sys_close_*) e entrou no design system. Ganchos que
     MercenaryInformations.js consulta, todos preservados: .content (arraste
     + contêiner) / .base / .close / .name / .level / .skill / .dismiss /
     .stats .atk/.Matk/.hit/.critical/.def/.Mdef/.flee/.aspd / .hp_bar* /
     .hp_value/.hp_max_value / .hp2 / .sp_bar* / .sp_value/.sp_max_value /
     .sp2 / .block2 .title_timeleft/.timeleft/.title_kills/.kills/
     .title_faith/.faith. As barras de HP/SP e os canvas de tempo/abates
     continuam vindo do JS — não são cor literal de CSS deste arquivo. -->
<div id="MercenaryInformations" class="ri-window">
	<div class="content">
		<div class="mi-titulo">
			<span class="text ri-title">Mercenário</span>
			<button type="button" class="base close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="title_name">Nome</div>
		<div class="name"></div>
		<div class="title_level">Nível</div>
		<div class="level"></div>

		<button type="button" class="skill ri-btn ri-btn--sec">Skills</button>
		<button type="button" class="dismiss ri-btn ri-btn--sec">Dispensar</button>

		<div class="stats">
			<div class="atk"></div>
			<div class="Matk"></div>
			<div class="hit"></div>
			<div class="critical"></div>
			<div class="def"></div>
			<div class="Mdef"></div>
			<div class="flee"></div>
			<div class="aspd"></div>
		</div>

		<div class="hp_bar">
			<div class="hp_bar_left"></div>
			<div class="hp_bar_middle"></div>
			<div class="hp_bar_right"></div>
			<div class="hp_bar_perc"><span class="hp_value"></span> / <span class="hp_max_value"></span></div>
		</div>
		<div class="hp2"></div>

		<div class="sp_bar">
			<div class="sp_bar_left"></div>
			<div class="sp_bar_middle"></div>
			<div class="sp_bar_right"></div>
			<div class="sp_bar_perc"><span class="sp_value"></span> / <span class="sp_max_value"></span></div>
		</div>
		<div class="sp2"></div>

		<div class="block2">
			<div class="title_timeleft">
				Tempo Restante
				<div class="timeleft"></div>
			</div>
			<canvas class="life title_timeleft" width="60" height="5"></canvas>

			<div class="title_kills">
				Abates
				<div class="kills"></div>
			</div>
			<canvas class="life title_kills" width="60" height="5"></canvas>

			<div class="title_faith">
				Fé
				<div class="faith"></div>
			</div>
		</div>
	</div>
</div>
