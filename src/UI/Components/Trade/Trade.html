<!-- Fase 3 (01/09/2026): a janela de troca saiu do bitmap (basic_interface/
     exchange_bg2.bmp, titlebar branca e os seis botoes GRF ok/trade/cancel)
     e virou o design system. Ganchos que Trade.js consulta, todos
     preservados: .titlebar (alca de arrasto, via Trade.draggable) /
     .titlebar .title (nome do outro jogador) / .overlay (+ .overlay.grey) /
     .box.send / .box.recv (com .box .item .icon / .amount / .amount .count /
     .name dentro) / .zeny.send / .zeny.recv / a classe .disabled ligada em
     tempo de execucao em .box e em .zeny.send / .btn.ok.enabled /
     .btn.ok.disabled / .btn.trade.enabled / .btn.trade.disabled /
     .btn.cancel. Os cinco <ui-button> de bitmap (ok/trade cada um com par
     habilitado-desabilitado, mais cancelar) viraram <button> com rotulo em
     texto; o rotulo era pintado no bitmap, agora e PT-BR direto no HTML. -->
<div id="Trade" class="ri-window">
	<div class="titlebar ri-header">
		<span class="ri-title">Troca <span class="title"></span></span>
	</div>
	<div class="overlay"></div>
	<div class="content">
		<div class="trade-panels">
			<section class="trade-col">
				<header class="trade-col-label">Você oferece</header>
				<div class="box send ri-scroll"></div>
				<div class="zeny-row">
					<span class="zeny-tag">Zeny</span>
					<input type="text" class="zeny send ri-input" value="0" />
				</div>
			</section>
			<div class="trade-divisor"></div>
			<section class="trade-col">
				<header class="trade-col-label">Você recebe</header>
				<div class="box recv ri-scroll"></div>
				<div class="zeny-row">
					<span class="zeny-tag">Zeny</span>
					<div class="zeny recv disabled">0</div>
				</div>
			</section>
		</div>
		<footer class="trade-actions">
			<button type="button" class="btn ok enabled ri-btn">Confirmar</button>
			<button type="button" class="btn ok disabled ri-btn" disabled>Confirmar</button>
			<button type="button" class="btn trade enabled ri-btn ri-btn--ouro">Trocar</button>
			<button type="button" class="btn trade disabled ri-btn" disabled>Trocar</button>
			<button type="button" class="btn cancel ri-btn ri-btn--sec">Cancelar</button>
		</footer>
	</div>
</div>
