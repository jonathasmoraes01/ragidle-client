<div id="TemporadaIdle">
	<div class="te-window ri-window ri-anima">
		<div class="te-titlebar ri-header">
			<span class="te-carteira" title="Seu saldo de RO Cash">
				<img class="te-carteira-icone" src="/ragidle/temporada/icone-ro-cash.webp" alt="" width="18" height="18">
				<span class="te-carteira-valor">0</span>
				<span class="te-carteira-unidade">RO Cash</span>
				<button type="button" class="te-recarregar" title="Recarregar RO Cash via PIX">
					<img class="te-recarregar-icone" src="/ragidle/temporada/icone-recarregar.webp" alt="" width="14" height="14">
					<span>Recarregar</span>
				</button>
			</span>
			<span class="te-title ri-title">Temporada</span>
			<span class="te-selo-vip ri-badge ri-badge--cinza">Sem VIP</span>
			<button type="button" class="te-close ri-close" title="Fechar">
				<img class="te-close-icone" src="/ragidle/temporada/botao-fechar.webp" alt="Fechar" width="22" height="22">
			</button>
		</div>

		<!-- As QUATRO abas (22/09/2026, contrato V2 do servidor): o Passe Semanal
		     SAIU - decisao do dono, desativado por completo - e o Passe de Batalha
		     VOLTOU a ser aba propria: tinha sido fundida nos Destaques em 21/09, e
		     o documento de redesenho e explicito: nao fundir, nao esconder. Ver o
		     cabecalho de TemporadaIdle.js e CONTRATO-TEMPORADA-V2.md. -->
		<div class="te-tabs">
			<button type="button" class="te-tab ri-tab is-active" data-tab="destaques">
				<img class="te-tab-icone" src="/ragidle/temporada/icone-destaques.webp" alt="" width="16" height="16">
				<span>Destaques</span>
			</button>
			<button type="button" class="te-tab ri-tab" data-tab="caixas">
				<!-- Icone proprio desde 22/09/2026 (arte do dono): o mesmo do atalho
				     "Caixas" dos Destaques. -->
				<img class="te-tab-icone" src="/ragidle/temporada/icone-caixas.webp" alt="" width="16" height="16">
				<span>Caixas</span>
			</button>
			<button type="button" class="te-tab ri-tab" data-tab="passe">
				<img class="te-tab-icone" src="/ragidle/temporada/icone-passe-de-batalha.webp" alt="" width="16" height="16">
				<span>Passe de Batalha</span>
			</button>
			<button type="button" class="te-tab ri-tab" data-tab="vip">
				<img class="te-tab-icone" src="/ragidle/temporada/icone-vip.webp" alt="" width="16" height="16">
				<span>VIP</span>
			</button>
		</div>

		<div class="te-body ri-scroll ri-janela-corpo">
			<div class="te-carregando">Carregando…</div>
		</div>

		<div class="te-aviso" aria-live="polite"></div>
	</div>

	<!-- Modal "Ver conteúdo": as 6 recompensas da caixa, separadas por categoria. -->
	<div class="te-modal te-modal--conteudo" hidden>
		<div class="te-modal-fundo"></div>
		<div class="te-modal-caixa ri-window">
			<div class="te-modal-cabecalho ri-header">
				<span class="te-title ri-title">Conteúdo</span>
				<button type="button" class="te-modal-fechar ri-close" title="Fechar">&times;</button>
			</div>
			<div class="te-modal-corpo ri-scroll"></div>
		</div>
	</div>

	<!-- Confirmação antes de gastar cash (caixa e VIP). -->
	<div class="te-modal te-modal--confirmar" hidden>
		<div class="te-modal-fundo"></div>
		<div class="te-modal-caixa ri-window te-modal-caixa--estreita">
			<div class="te-modal-cabecalho ri-header">
				<span class="te-title ri-title">Confirmar compra</span>
			</div>
			<div class="te-modal-corpo">
				<p class="te-confirmar-texto"></p>
				<div class="te-confirmar-acoes">
					<button type="button" class="te-confirmar-ok ri-btn ri-btn--ouro">Confirmar</button>
					<button type="button" class="te-confirmar-cancelar ri-btn ri-btn--sec">Cancelar</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Reveal da abertura de uma caixa (resultado.abertura). -->
	<div class="te-reveal" hidden></div>
</div>
