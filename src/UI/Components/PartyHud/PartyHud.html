<div id="PartyHud">
	<!-- A HUD nasce ESCONDIDA e só aparece com party. Uma faixa vazia no canto
	     da tela é ruído permanente para quem joga sozinho, que é a maioria. -->
	<div class="ph-hud" hidden>
		<!-- A ALCA e a unica parte que recebe toque (D-1565): a lista segue
		     transparente ao clique, para o jogador clicar na cena atraves dela. -->
		<div class="ph-alca">
			<span class="ph-pegar" aria-hidden="true">⠿</span>
			<span class="ph-rotulo">Grupo</span>
			<!-- RECOLHER (17/10/2026, relato de jogador): com nove membros a lista
			     cobria ~40% do celular em pe e nao havia como tira-la da frente. -->
			<button type="button" class="ph-recolher" title="Recolher"
				aria-label="Recolher a lista do grupo">&minus;</button>
		</div>
		<div class="ph-membros"></div>
	</div>
</div>
