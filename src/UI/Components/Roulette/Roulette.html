<!-- Fase 3 (01/09/2026): a roleta saiu do skin escuro (roulletteBG.bmp,
     cinzas cravados) e entrou no design system claro. Ganchos que
     Roulette.js consulta, TODOS preservados: .titlebar (draggable) / .close
     (fechar) / .btn-spin / .btn-info / .btn-close / .wheel-slots (slots
     gerados em runtime) / .points-value / .result-item. -->
<div id="Roulette">
	<div class="body ri-window">
		<div class="titlebar ri-header">
			<span class="title ri-title">Roleta</span>
			<button type="button" class="base close ri-close" title="Fechar">&times;</button>
		</div>

		<div class="roulette-container">
			<div class="roulette-wheel">
				<div class="wheel-center"></div>
				<div class="wheel-slots">
					<!-- Slots will be generated dynamically -->
				</div>
				<div class="wheel-pointer"></div>
			</div>

			<div class="roulette-info">
				<div class="points-display">
					<span class="label">Pontos:</span>
					<span class="points-value">0</span>
				</div>

				<div class="buttons-container">
					<button class="btn-spin ri-btn">
						<span>Girar</span>
					</button>
					<button class="btn-info ri-btn ri-btn--sec">
						<span>Informações</span>
					</button>
					<button class="btn-close ri-btn ri-btn--ouro">
						<span>Resgatar Prêmio</span>
					</button>
				</div>

				<div class="result-display">
					<span class="result-label">Resultado:</span>
					<div class="result-item"></div>
				</div>
			</div>
		</div>
	</div>
</div>
