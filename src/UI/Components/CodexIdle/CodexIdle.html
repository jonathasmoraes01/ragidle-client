<div id="CodexIdle">
	<div class="cx-window ri-window ri-anima">
		<div class="cx-titlebar ri-header">
			<!-- O SALDO mora na barra de titulo pelo mesmo motivo da carteira do
			     PasseIdle: e a primeira coisa que o jogador confere antes de
			     decidir onde gastar, e no rodape ficaria ABAIXO dos botoes que o
			     consomem. Absoluto a esquerda, espelhando o ".ri-close" a
			     direita - assim o titulo continua centrado como em toda outra
			     janela do sistema. -->
			<span class="cx-saldo" title="Pontos do Codex que voce ainda nao gastou">
				<span class="cx-saldo-valor">0</span>
				<span class="cx-saldo-unidade">pontos</span>
			</span>
			<span class="cx-title ri-title">Codex</span>
			<button type="button" class="cx-close ri-close" title="Fechar">&times;</button>
		</div>

		<!-- AS TRES ABAS (16/09/2026, merge com origin/master). "Missoes" e
		     "Status" sao a antiga aba unica "Codex" DIVIDIDA (08/09/2026): as
		     missoes do bestiario, onde os pontos nascem, e os sete eixos, onde
		     eles se gastam. A Jornada nao e uma segunda secao rolando abaixo
		     deles: ela tem tres telas proprias e pede um pacote por capitulo.
		     Aba e o interruptor que nao custa nada a quem so quer gastar um
		     ponto, e o `memoriaDeAba.js` faz o jogador voltar onde estava. O
		     racional inteiro esta no cabecalho de CodexIdle.js. -->
		<div class="cx-tabs">
			<button type="button" class="cx-tab ri-tab is-active" data-aba="missoes">Missões</button>
			<button type="button" class="cx-tab ri-tab" data-aba="status">Status</button>
			<button type="button" class="cx-tab ri-tab" data-aba="jornada">Missões do Códex</button>
		</div>

		<div class="cx-body ri-scroll">
			<div class="cx-carregando">Carregando…</div>
		</div>
	</div>
</div>
