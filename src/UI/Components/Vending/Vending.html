<!-- Fase 3 (01/09/2026): a bancada de venda (duas mini-janelas soltas dentro
     de UM componente -- InputWindow = estoque disponivel, OutputWindow =
     montagem da loja) saiu do bitmap classico (titlebar_mid.bmp,
     itemwin_mid.bmp, btnbar_mid2.bmp, btn_resize/ok/cancel.bmp) para o design
     system. Ganchos que Vending.js consulta, TODOS preservados: .InputWindow
     / .OutputWindow (draggable proprio de cada mini-janela + drop de item) /
     .titlebar (alca de arraste) / .footer .extend (redimensionar o estoque)
     / .content (delegacao de contextmenu/wheel/mouseover/mouseout/dblclick/
     mousedown/dragstart/dragend) / .content.available / .add_shop / .overlay
     / .shopname / .nstore / .limit / .limitZeny / .zeny / .btn.sell /
     .btn.cancel / .zenyLabel / .zenySpan / .weightLabel / .weightSpan /
     .WinBuy / .WinSell (o JS troca o display deles conforme o tipo de banca:
     venda normal ou banca de compra). O grid de itens em si
     (.item-container/.item/.icon/.amount/.amount_/.name/.price/.selected/
     .damaged) e montado pelo proprio JS (addItem/transferItem) -- so a pele
     mudou, o markup que ele gera continua igual. -->
<div id="vending">
	<div class="InputWindow ri-window">
		<div class="titlebar ri-header">
			<span class="text ri-title">
				<span class="WinSell"><ui-text msg="232">Available Items for Vending</ui-text></span>
				<span class="WinBuy"><ui-text msg="1733">Available Items for Buying</ui-text></span>
			</span>
		</div>
		<div class="container">
			<div class="overlay"></div>
			<div class="content available ri-scroll"></div>
		</div>
		<div class="footer">
			<ui-button class="extend" aria-label="Redimensionar estoque"></ui-button>
		</div>
	</div>
	<div class="OutputWindow ri-window">
		<div class="titlebar ri-header">
			<span class="text ri-title">
				<span class="WinSell"><ui-text msg="224">Vending</ui-text></span>
				<span class="WinBuy"><ui-text msg="1720">Buying</ui-text></span>
			</span>
		</div>
		<div class="container">
			<div class="nstore"><ui-text msg="407">Name</ui-text></div>
			<input class="shopname ri-input" type="text" value="" maxlength="36" />
			<div class="content add_shop ri-scroll"></div>
		</div>
		<div class="footer WinBuy">
			<span class="WinBuy zenyLabel"><ui-text msg="2464">Zeny</ui-text></span>
			<span class="WinBuy zenySpan">0</span>
			<span class="WinBuy weightLabel">Peso:</span>
			<span class="WinBuy weightSpan">0/0</span>
		</div>
		<div class="footer">
			<div class="limit WinBuy"><ui-text msg="1723">Purchase Zeny Limit</ui-text></div>
			<input class="limitZeny WinBuy ri-input" type="text" value="" maxlength="36" />
			<div class="zeny WinBuy"><ui-text msg="2464">Zeny</ui-text></div>
			<ui-button class="btn sell ri-btn">Confirmar</ui-button>
			<ui-button class="btn cancel ri-btn ri-btn--sec">Cancelar</ui-button>
		</div>
	</div>
</div>
