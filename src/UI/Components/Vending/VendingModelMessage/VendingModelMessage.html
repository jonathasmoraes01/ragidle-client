<!-- Fase 3 (01/09/2026): a caixa de aviso da banca (erro de vender/comprar,
     preco invalido, sem zeny, nome vazio etc.) saiu do bitmap
     (titlebar_mid.bmp, sys_base_off/on.bmp, btn_ok.bmp) para o design system.
     Ganchos que VendingModelMessage.js consulta, todos preservados: .titlebar
     (alca de arraste) / .message (span onde DB.getMessage(numMessage) escreve
     o texto) / .ok (fecha a caixa). O selo decorativo "sys_base_off/on" saiu
     junto com o bitmap -- nao tinha listener, era so ornamento sem
     equivalente no design system (nenhum dos tres tratamentos de icone se
     aplica a um selo de canto sem funcao). -->
<div id="VendingModelMessage" class="ri-window">
	<div class="titlebar ri-header">
		<span class="text ri-title">Aviso</span>
	</div>
	<div class="container">
		<div class="text_message">
			<span class="text message"></span>
		</div>
		<div class="btns">
			<button type="button" class="btn ok ri-btn">Ok</button>
		</div>
	</div>
</div>
